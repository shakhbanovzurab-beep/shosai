[project]
name = "shosai"
version = "2.0.0"
description = "Shosai backend: one modular monolith with the api, ws, workers and scheduler roles"
readme = "README.md"
requires-python = ">=3.14"
# Коммерческая лицензия проекта; канонический текст — LICENSE в корне репозитория,
# копию здесь требует упаковка (PEP 639 не допускает путей вне проекта).
license = "LicenseRef-Shosai-Commercial"
license-files = ["LICENSE"]
# Рантайм-зависимости добавляет шаг плана F1, которому они нужны
# (docs/plan/packages/F1-backend-foundation.md, раздел 4).
dependencies = [
    "aiobotocore>=3.9.2",
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    # Хеши паролей: хеши черновика переносятся как есть (§18.2, DATA_MAPPING §5.1).
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    # Клиент Gemini Live: синхронный перевод и голос (F6, §18.2); держит websockets ниже 17.
    "google-genai>=2.30.1",
    # Исходящие вызовы: OpenRouter, pyannote и другие провайдеры ИИ, курс ЦБ (F6, ADR 0034).
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-redis>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    # Токены доступа и обновления, совместимые с черновиком: HS256 (§18.2, ADR 0045).
    "pyjwt>=2.15.1",
    # Нативный импорт записи (notes шаг 9b): тело multipart разбирается потоком, без диска.
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.2",
    "structlog>=26.1.0",
    "taskiq>=0.13.0",
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0",
    # Потоковая расшифровка через OpenAI Realtime (F6 шаг 3b).
    "websockets>=16.1.1",
]

# Одна консольная команда образа: роль процесса — подкоманда (README, «Process roles»).
[project.scripts]
shosai = "shosai.entrypoints.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-doctor>=2026.5.11",
    "ruff>=0.16.10",
    # Харнесс D1: тесты сверяют маршруты слайса с контрактом черновика (contracts/README.md).
    "types-aiobotocore[s3]>=3.9.2",
    "shosai-contracts",
    "aiosmtpd>=1.4.6",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "PL", "C90", "S", "ANN", "ASYNC",
    "BLE", "T20", "DTZ", "G", "LOG", "PIE", "PERF", "PT", "RET", "PTH", "ERA", "TID", "FBT",
]
# RUF001, RUF003: сообщения для инженера и комментарии пишутся по-русски; докстринги —
# по-английски (CLAUDE.md, «Language»), их проверяет tests/architecture/test_docstrings_english.py.
ignore = ["PLR2004", "RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# S105/S106: пароли в тестах — заведомо фальшивые значения для проверок харнесса.
"tests/**" = ["S101", "S105", "S106"]
# S603: тест границ запускает lint-imports подпроцессом с фиксированными аргументами.
"tests/architecture/**" = ["S603"]

[tool.ruff.lint.isort]
known-first-party = ["shosai", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
# SQLAlchemy 2.1 не аннотирует конструктор DDL (строка и словарь подстановок);
# остальные вызовы SQLAlchemy проверяются строго.
untyped_calls_exclude = ["sqlalchemy.sql.ddl.DDL"]
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "unused-awaitable",
    "exhaustive-match",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "--strict-config"]
xfail_strict = true
# Предупреждения — ошибки. Исключение: google-genai 2.30 при импорте сравнивает
# устаревший `_UnionGenericAlias` Python 3.14; это его код, не наш, и он не влияет на работу.
filterwarnings = [
    "error",
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google\\.genai",
]
# Слот тестовых баз захватывается один раз на прогон и держит соединения в одном
# цикле событий (ADR 0009), поэтому и фикстуры, и тесты живут в цикле сессии.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "isolation(resource): the isolation kit checks a read path of this shareable resource kind (§14 rule 12)",
]

[tool.coverage.run]
source = ["shosai"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]

# Границы архитектуры (target architecture §5, §14 правило 12); проверка — `uv run lint-imports`.
[tool.importlinter]
root_package = "shosai"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Layers: entrypoints -> composition -> features -> core"
type = "layers"
containers = ["shosai"]
layers = ["entrypoints", "composition", "features", "core"]
exhaustive = true

[[tool.importlinter.contracts]]
id = "features-meet-through-contracts"
name = "Features meet through contracts"
type = "independence"
modules = ["shosai.features.*"]
# Контракт среза — модуль contracts.py или пакет contracts/ с подмодулями (события отдельно).
ignore_imports = [
    "shosai.features.** -> shosai.features.*.contracts",
    "shosai.features.** -> shosai.features.*.contracts.**",
]
# Пакет contracts/ есть не у каждого среза: несовпавший шаблон — не ошибка.
unmatched_ignore_imports_alerting = "none"
broken_contract_guidance = "A slice imports another slice only through its contracts module or package."

[[tool.importlinter.contracts]]
id = "pure-kernel"
name = "Pure kernel"
type = "forbidden"
source_modules = ["shosai.core.kernel"]
forbidden_modules = [
    "aioboto3", "aiobotocore", "alembic", "botocore", "fastapi", "httpx", "opentelemetry",
    "prometheus_client", "psycopg", "redis", "sqlalchemy", "starlette", "structlog", "taskiq",
    "taskiq_redis", "uvicorn",
]
broken_contract_guidance = "core.kernel stays framework-free; move the adapter to its core package."

# Домен среза не знает ни фреймворка, ни базы, ни транспорта, ни агентного рантайма, ни SDK
# провайдеров (CLAUDE.md «Architecture»; Leo ARCHITECTURE §3.3); косвенные импорты тоже.
# `google` — пространство google-genai: подпакет внешнего пакета import-linter не принимает.
[[tool.importlinter.contracts]]
id = "pure-slice-domain"
name = "Pure slice domain"
type = "forbidden"
source_modules = ["shosai.features.*.domain"]
forbidden_modules = [
    "aioboto3", "aiobotocore", "alembic", "bcrypt", "botocore", "fastapi", "google", "httpx",
    "jwt", "langchain_core", "langgraph", "livekit", "openai", "opentelemetry",
    "prometheus_client", "psycopg", "redis", "sqlalchemy", "starlette", "structlog", "taskiq",
    "taskiq_redis", "uvicorn", "websockets",
]
broken_contract_guidance = "A slice's domain is pure; put the adapter in its infrastructure or channels."

# SDK провайдеров ИИ — только в порте (ADR 0034 п. 3): прямой импорт где-либо ещё запрещён.
# Косвенный путь через порт законен: так срезы и вызывают модели.
[[tool.importlinter.contracts]]
id = "provider-sdks-in-the-port"
name = "Provider SDKs only in core.ai"
type = "forbidden"
source_modules = ["shosai"]
forbidden_modules = ["google", "openai", "mistralai", "websockets"]
ignore_imports = [
    "shosai.core.ai.** -> google",
    "shosai.core.ai.** -> openai",
    "shosai.core.ai.** -> mistralai",
    "shosai.core.ai.** -> websockets",
]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "none"
broken_contract_guidance = "Call models through CoreServices.ai; provider clients live in core.ai."

# Типы-значения порта лёгкие, как ядро (ADR 0034 п. 4): их импортируют контракты срезов.
[[tool.importlinter.contracts]]
id = "light-ai-values"
name = "Light AI value types"
type = "forbidden"
source_modules = [
    "shosai.core.ai.calls", "shosai.core.ai.decisions", "shosai.core.ai.documents",
    "shosai.core.ai.requests", "shosai.core.ai.results",
]
forbidden_modules = [
    "aiobotocore", "fastapi", "google", "httpx", "openai", "psycopg", "redis", "sqlalchemy",
    "starlette", "structlog", "taskiq", "websockets",
]
broken_contract_guidance = "core.ai value types stay framework-free; move the code to an adapter."

# Контракт инструментов агента лёгкий, как ядро (ADR 0029): его импортируют контракты всех
# срезов и агент; ни фреймворка, ни базы, ни Valkey, ни SDK провайдеров, ни агентного рантайма.
[[tool.importlinter.contracts]]
id = "light-agent-tools"
name = "Light agent tool contract"
type = "forbidden"
source_modules = ["shosai.core.agent_tools"]
forbidden_modules = [
    "aiobotocore", "alembic", "fastapi", "google", "httpx", "langchain_core", "langgraph",
    "openai", "opentelemetry", "prometheus_client", "psycopg", "redis", "sqlalchemy",
    "starlette", "structlog", "taskiq", "uvicorn", "websockets",
]
broken_contract_guidance = "core.agent_tools stays framework-free; bind handlers in the slice."

# Порты между срезами и реестр данных человека — контракты, как инструменты агента:
# только значения и ключи, реализации у срезов (ADR 0045 п. 7, 11).
[[tool.importlinter.contracts]]
id = "light-slice-contracts"
name = "Light slice contracts"
type = "forbidden"
source_modules = ["shosai.core.ports", "shosai.core.account_data"]
forbidden_modules = [
    "aiobotocore", "alembic", "fastapi", "google", "httpx", "openai", "opentelemetry",
    "prometheus_client", "psycopg", "redis", "sqlalchemy", "starlette", "structlog", "taskiq",
    "uvicorn", "websockets",
]
broken_contract_guidance = "core.ports and core.account_data hold values only; implement in the slice."

# Только для `uv run alembic revision -m "…"`: новая ревизия по шаблону с applies_to.
# Применяет миграции не CLI Alembic, а раннер shosai.core.db.migrations (ADR 0010).
[tool.alembic]
script_location = "%(here)s/src/shosai/migrations"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s"

[tool.uv.sources]
shosai-contracts = { path = "../contracts", editable = true }
