[project]
name = "whisperer"
version = "2.0.0"
description = "Whisperer backend: one modular monolith with the api, ws, workers and scheduler roles"
readme = "README.md"
requires-python = ">=3.14"
# Коммерческая лицензия проекта; канонический текст — LICENSE в корне репозитория,
# копию здесь требует упаковка (PEP 639 не допускает путей вне проекта).
license = "LicenseRef-Whisperer-Commercial"
license-files = ["LICENSE"]
# Рантайм-зависимости добавляет шаг плана F1, которому они нужны
# (docs/plan/packages/F1-backend-foundation.md, раздел 4).
dependencies = [
    "aiobotocore>=3.9.2",
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-redis>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.2",
    "structlog>=26.1.0",
    "taskiq>=0.13.0",
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0",
]

# Одна консольная команда образа: роль процесса — подкоманда (README, «Process roles»).
[project.scripts]
whisperer = "whisperer.entrypoints.cli:main"

[dependency-groups]
dev = [
    # Харнесс тестовых баз (ADR 0009) держит прямые соединения роли миграций.
    # Тесты HTTP-оболочки ходят в приложение через ASGI-транспорт HTTPX.
    "httpx>=0.28.1",
    "hypothesis>=6.168.3",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-doctor>=2026.5.11",
    "ruff>=0.16.10",
    # Харнесс D1: тесты сверяют маршруты слайса с контрактом черновика (contracts/README.md).
    "types-aiobotocore[s3]>=3.9.2",
    "whisperer-contracts",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "PL", "C90", "S", "ANN", "ASYNC",
    "BLE", "T20", "DTZ", "G", "LOG", "PIE", "PERF", "PT", "RET", "PTH", "ERA", "TID", "FBT",
]
# RUF001, RUF003: сообщения для инженера и комментарии пишутся по-русски; докстринги —
# по-английски (CLAUDE.md, «Language»), их проверяет tests/architecture/test_docstrings_english.py.
ignore = ["PLR2004", "RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# S105/S106: пароли в тестах — заведомо фальшивые значения для проверок харнесса.
"tests/**" = ["S101", "S105", "S106"]
# S603: тест границ запускает lint-imports подпроцессом с фиксированными аргументами.
"tests/architecture/**" = ["S603"]

[tool.ruff.lint.isort]
known-first-party = ["whisperer", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
# SQLAlchemy 2.1 не аннотирует конструктор DDL (строка и словарь подстановок);
# остальные вызовы SQLAlchemy проверяются строго.
untyped_calls_exclude = ["sqlalchemy.sql.ddl.DDL"]
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "unused-awaitable",
    "exhaustive-match",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
# Слот тестовых баз захватывается один раз на прогон и держит соединения в одном
# цикле событий (ADR 0009), поэтому и фикстуры, и тесты живут в цикле сессии.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["whisperer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]

# Границы архитектуры (target architecture §5, §14 правило 12); проверка — `uv run lint-imports`.
[tool.importlinter]
root_package = "whisperer"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Layers: entrypoints -> composition -> features -> core"
type = "layers"
containers = ["whisperer"]
layers = ["entrypoints", "composition", "features", "core"]
exhaustive = true

[[tool.importlinter.contracts]]
id = "features-meet-through-contracts"
name = "Features meet through contracts"
type = "independence"
modules = ["whisperer.features.*"]
ignore_imports = ["whisperer.features.** -> whisperer.features.*.contracts"]
# Пока слайсов нет, исключению не с чем совпасть; это не ошибка конфигурации.
unmatched_ignore_imports_alerting = "none"
broken_contract_guidance = "A slice imports another slice only through its contracts module."

[[tool.importlinter.contracts]]
id = "pure-kernel"
name = "Pure kernel"
type = "forbidden"
source_modules = ["whisperer.core.kernel"]
forbidden_modules = [
    "aioboto3", "aiobotocore", "alembic", "botocore", "fastapi", "httpx", "opentelemetry",
    "prometheus_client", "psycopg", "redis", "sqlalchemy", "starlette", "structlog", "taskiq",
    "taskiq_redis", "uvicorn",
]
broken_contract_guidance = "core.kernel stays framework-free; move the adapter to its core package."

# Только для `uv run alembic revision -m "…"`: новая ревизия по шаблону с applies_to.
# Применяет миграции не CLI Alembic, а раннер whisperer.core.db.migrations (ADR 0010).
[tool.alembic]
script_location = "%(here)s/src/whisperer/migrations"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s"

[tool.uv.sources]
whisperer-contracts = { path = "../contracts", editable = true }
