# Release to staging (F4 step 4, target architecture §17, ADR 0050). After CI passes on a push to
# main, this workflow builds the backend, edge and observability configuration (F5-D6) images of
# that commit, pushes them to GHCR and
# deploys them to https://shosai.tech over SSH. The SSH key may run only deploy/staging/release.sh;
# the application's secrets stay on the host, so GitHub holds the key, the host's public key and
# the cabinet's build variables only.
name: Release
# The released commit names the run, so the next run knows what staging runs.
run-name: Release ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release-staging
  # A running release always finishes; a newer commit waits for it instead of cutting it short.
  cancel-in-progress: false

jobs:
  pick:
    name: Pick the commit
    # A commit whose CI passed is released when it is newer than the commit staging runs: a slower
    # CI run of an older commit never replaces a newer release, and pushes faster than CI no longer
    # starve staging, as releasing only the head of main did (2026-10-27). Staging runs the commit
    # of the latest run whose deploy succeeded; runs before 2026-10-27 released their head.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      release: ${{ steps.newer.outputs.release }}
    steps:
      - id: newer
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?status=success&per_page=30" \
            --jq '.workflow_runs[]
              | [.id, ((.display_title | capture("^Release (?<sha>[0-9a-f]{40})$").sha) // .head_sha)]
              | @tsv' > "$RUNNER_TEMP/runs"
          released=""
          while IFS=$'\t' read -r run commit; do
            deployed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
              --jq '.jobs[] | select(.name == "Deploy to staging") | .conclusion')"
            if [ "$deployed" = "success" ]; then
              released="$commit"
              break
            fi
          done < "$RUNNER_TEMP/runs"
          status="ahead"
          if [ -n "$released" ]; then
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$released...$CANDIDATE" --jq .status)"
          fi
          echo "staging runs ${released:-nothing}; $CANDIDATE is $status of it"
          if [ "$status" = "ahead" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  images:
    name: Images
    needs: pick
    if: needs.pick.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The environment holds CABINET_ENV, the cabinet's build variables.
    environment: staging
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.names.outputs.backend }}@${{ steps.backend.outputs.digest }}
      edge: ${{ steps.names.outputs.edge }}@${{ steps.edge.outputs.digest }}
      observability: ${{ steps.names.outputs.observability }}@${{ steps.observability.outputs.digest }}
    steps:
      # The head of main, then exactly the commit whose CI passed — which may be behind the head by
      # now — once it is shown to be on main's history, so no other branch's code is ever built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The commit that passed
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! git merge-base --is-ancestor "$COMMIT" HEAD; then
            echo "::error::$COMMIT is not on main"
            exit 1
          fi
          git checkout --quiet --detach "$COMMIT"
      - id: names
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=$registry/shosai-backend:$COMMIT" >> "$GITHUB_OUTPUT"
          echo "edge=$registry/shosai-edge:$COMMIT" >> "$GITHUB_OUTPUT"
          echo "observability=$registry/shosai-observability:$COMMIT" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Backend image
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: ${{ steps.names.outputs.backend }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Cabinet build variables
        env:
          CABINET_ENV: ${{ secrets.CABINET_ENV }}
        run: |
          if [ -z "$CABINET_ENV" ]; then
            echo "::error::the staging environment has no CABINET_ENV secret"
            exit 1
          fi
          umask 077
          printf '%s\n' "$CABINET_ENV" > "$RUNNER_TEMP/cabinet.env"
      - name: Edge image
        id: edge
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.edge }}
          secret-files: cabinet_env=${{ runner.temp }}/cabinet.env
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge
      # Files only: the configs, rules and dashboards the observability stack mounts (F5-D6).
      - name: Observability configuration image
        id: observability
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/observability
          push: true
          tags: ${{ steps.names.outputs.observability }}

  deploy:
    name: Deploy to staging
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: staging
      url: https://shosai.tech
    permissions:
      # The job's token pulls the images on the host and expires when the job ends.
      packages: read
    steps:
      - name: Release over SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ github.token }}
          BACKEND_IMAGE: ${{ needs.images.outputs.backend }}
          EDGE_IMAGE: ${{ needs.images.outputs.edge }}
          OBSERVABILITY_IMAGE: ${{ needs.images.outputs.observability }}
        run: |
          umask 077
          ssh_dir="$RUNNER_TEMP/ssh"
          mkdir -p "$ssh_dir"
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -i "$ssh_dir/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ServerAliveInterval=30 \
            "deploy@$SSH_HOST" release "$GITHUB_ACTOR" "$BACKEND_IMAGE" "$EDGE_IMAGE" "$OBSERVABILITY_IMAGE"
