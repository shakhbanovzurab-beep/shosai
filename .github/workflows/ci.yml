# Quality gates for every push to main. The rules behind each job are in
# .claude/CLAUDE.md ("Checks") and docs/design/ARCHITECTURE.md (§14, §17).
# Backend and frontend jobs run only once their project files exist.
# The contracts job guards the draft API baseline and its harness (contracts/README.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Every commit on main is verified; superseded runs are cancelled elsewhere only.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  repository:
    name: Repository rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: File length limits and tracked secrets
        run: uv run --no-project --python 3.14 scripts/ci/check_repository.py
      - name: Mandatory-skills hook tests
        run: uv run --no-project --python 3.14 --with pytest==9.1.1 pytest -q .claude/hooks
      - name: Local environment definition
        run: |
          docker compose --file compose.dev.yaml config --quiet
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0 --severity=style \
            scripts/local-env.sh deploy/local/postgres/init-home.sh deploy/local/pgbouncer/start.sh

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan
        # .claude/ holds third-party agent skills, not Shosai code.
        run: semgrep scan --config p/default --error --metrics=off --exclude .claude

  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: contracts
          enable-cache: true
          cache-dependency-glob: contracts/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: mypy (strict)
        run: uv run mypy
      - name: Harness tests, baseline consistency, rendered documents
        run: uv run pytest
      - name: python-doctor 100/100
        run: uv run python-doctor . --min-score 100 --no-cache

  parity:
    name: Parity harness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: parity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: parity/.nvmrc
          cache: npm
          cache-dependency-path: parity/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Harness tests (state registry, draft contract, replay, normalization)
        run: npm test
      - name: Shell scripts and Compose definition
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0 --severity=style \
            scripts/*.sh recording/record.sh
          docker compose --file compose.yaml config --quiet

  detect:
    name: Detect projects
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.projects.outputs.backend }}
      frontend: ${{ steps.projects.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: projects
        run: |
          echo "backend=$([ -f backend/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      # Tests read only TEST_* variables (ADR 0009). The values are the throwaway
      # local defaults of compose.dev.yaml, the same as .env.example section 3.
      TEST_HOME_RU_DATABASE_URL: postgresql://shosai_app:local-app@127.0.0.1:16432/shosai_test
      TEST_HOME_EU_DATABASE_URL: postgresql://shosai_app:local-app@127.0.0.1:16433/shosai_test
      TEST_HOME_RU_MIGRATION_DATABASE_URL: postgresql://shosai_migrator:local-migrator@127.0.0.1:15432/shosai_test
      TEST_HOME_EU_MIGRATION_DATABASE_URL: postgresql://shosai_migrator:local-migrator@127.0.0.1:15433/shosai_test
      TEST_DATABASE_SLOTS: "8"
      TEST_VALKEY_URL: redis://:local-valkey@127.0.0.1:16379
      TEST_REDIS_CACHE_URL: redis://:local-redis-cache@127.0.0.1:16380
      TEST_S3_ENDPOINT_URL: http://127.0.0.1:18333
      TEST_S3_REGION: local
      TEST_S3_BUCKET: shosai
      TEST_S3_ACCESS_KEY_ID: local-s3-access
      TEST_S3_SECRET_ACCESS_KEY: local-s3-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start both data homes, Valkey, the cache and the bucket
        # The same services and topology as local development (docs/development.md).
        working-directory: .
        run: >-
          docker compose --file compose.dev.yaml up --detach --wait --wait-timeout 180
          postgres-ru postgres-eu pgbouncer-ru pgbouncer-eu valkey redis-cache s3
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: mypy (strict)
        run: uv run mypy --strict .
      - name: Architecture boundaries
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest --cov
      - name: python-doctor 100/100
        run: uv run python-doctor . --min-score 100 --no-cache
      - name: Dependency vulnerabilities
        run: uv run pip-audit --skip-editable
      - name: Local services logs
        if: failure()
        working-directory: .
        run: docker compose --file compose.dev.yaml logs --no-color --tail 200

  frontend:
    name: Frontend
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: react-doctor 100/100
        run: |
          # A crash leaves the score empty, which fails the check below.
          score="$(npm run --silent doctor -- --score | tr -d '[:space:]')" || true
          if [ "$score" != "100" ]; then
            echo "::error::react-doctor score is ${score:-empty}, required 100"
            npm run --silent doctor
            exit 1
          fi
