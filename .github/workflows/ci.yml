# Quality gates for every push to main. The rules behind each job are in
# .claude/CLAUDE.md ("Checks") and docs/design/ARCHITECTURE.md (§14, §17).
# Backend and frontend jobs run only once their project files exist.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Every commit on main is verified; superseded runs are cancelled elsewhere only.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  repository:
    name: Repository rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: File length limits and tracked secrets
        run: uv run --no-project --python 3.14 scripts/ci/check_repository.py
      - name: Mandatory-skills hook tests
        run: uv run --no-project --python 3.14 --with pytest==9.1.1 pytest -q .claude/hooks

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan
        # .claude/ holds third-party agent skills, not Whisperer code.
        run: semgrep scan --config p/default --error --metrics=off --exclude .claude

  detect:
    name: Detect projects
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.projects.outputs.backend }}
      frontend: ${{ steps.projects.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: projects
        run: |
          echo "backend=$([ -f backend/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: whisperer
          POSTGRES_PASSWORD: whisperer
          POSTGRES_DB: whisperer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whisperer -d whisperer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database; tests read only TEST_DATABASE_URL, never DATABASE_URL.
      TEST_DATABASE_URL: postgresql+asyncpg://whisperer:whisperer@localhost:5432/whisperer_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: mypy (strict)
        run: uv run mypy --strict .
      - name: Architecture boundaries
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest --cov
      - name: python-doctor 100/100
        run: uv run python-doctor . --min-score 100 --no-cache
      - name: Dependency vulnerabilities
        run: uv run pip-audit --skip-editable

  frontend:
    name: Frontend
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: react-doctor 100/100
        run: |
          # A crash leaves the score empty, which fails the check below.
          score="$(npm run --silent doctor -- --score | tr -d '[:space:]')" || true
          if [ "$score" != "100" ]; then
            echo "::error::react-doctor score is ${score:-empty}, required 100"
            npm run --silent doctor
            exit 1
          fi
