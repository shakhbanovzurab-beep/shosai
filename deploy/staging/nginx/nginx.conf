# Edge Shosai (target architecture §4.2): TLS, статика кабинета, лимиты §4.3, маршруты к api и ws.
# Работает без root в непривилегированном образе NGINX: слушает 8080 и 8443, пишет только в /tmp.

worker_processes auto;
worker_rlimit_nofile 8192;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;

    # Журнал в JSON без строки запроса: в ней бывают токены (ссылки отписки, коды) — §14, «Security».
    log_format shosai_json escape=json
        '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"upstream":"$upstream_addr","user_agent":"$http_user_agent"}';
    access_log /dev/stdout shosai_json;

    server_tokens off;
    # Перенаправления — относительные: внутри контейнера NGINX слушает 8443, снаружи это 443.
    absolute_redirect off;
    sendfile on;
    tcp_nopush on;
    # Простаивающее соединение клиента; к бэкенду — короче его 75 с (backend README, «Stop»).
    keepalive_timeout 65s;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/manifest+json text/plain;

    # §4.3: 50 запросов в секунду и 1 000 соединений с одного адреса; сверх — 429.
    limit_req_zone $binary_remote_addr zone=shosai_per_ip:20m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=shosai_conn_per_ip:20m;
    limit_req_status 429;
    limit_conn_status 429;

    # Заголовок Upgrade превращает прокси-соединение в WebSocket только там, где клиент его просит.
    map $http_upgrade $shosai_connection_upgrade {
        default upgrade;
        "" close;
    }

    include /tmp/nginx/conf.d/*.conf;
}
