# Edge Shosai (target architecture §4.2): TLS, статика кабинета, лимиты §4.3, маршруты к api и ws.
# Работает без root в непривилегированном образе NGINX: слушает 8080 и 8443, пишет только в /tmp.
# На 8443 — поток с разбором SNI (meetings A14): TURN/TLS LiveKit или HTTPS edge на 127.0.0.1:8444.

# Трейсы edge (F5): модуль OpenTelemetry из образа nginx-unprivileged с суффиксом -otel.
load_module modules/ngx_otel_module.so;

worker_processes auto;
worker_rlimit_nofile 8192;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;

    # Журнал в JSON без персональных данных (target architecture §16.8): ни адреса клиента, ни его
    # user agent, ни строки запроса, ни пути — путь на 404 клиент пишет любой, хоть с адресом почты.
    # Вместо пути — его класс по первому сегменту; маршрут API пишет строка api с тем же request_id
    # и trace_id. Уровень — из статуса: метка level в Loki (§16.7).
    map $uri $shosai_path_class {
        ~^/v1(/|$)     /v1;
        ~^/app(/|$)    /app;
        ~^/admin(/|$)  /admin;
        ~^/email(/|$)  /email;
        ~^/dl(/|$)     /dl;
        ~^/\.well-known/acme-challenge/  /.well-known;
        /              /;
        default        other;
    }
    # Скачивание файла (templates/shosai/downloads.conf.template): путь и подпись ссылки бакета —
    # из сырой строки запроса, как её подписал бэкенд; без строки подписи — пусто, и edge отвечает 404.
    map $request_uri $shosai_download_path {
        "~^/dl/(?:ru|eu)(/[^?]+\?.+)$"  $1;
        default                          "";
    }
    # $shosai_log_trace_id задаёт otel.conf.template: trace_id только трассируемых запросов.
    map $status $shosai_log_level {
        ~^5     error;
        ~^4     warning;
        default info;
    }
    log_format shosai_json escape=json
        '{"time":"$time_iso8601","level":"$shosai_log_level","request_id":"$request_id",'
        '"trace_id":"$shosai_log_trace_id","method":"$request_method","path_class":"$shosai_path_class",'
        '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","upstream":"$upstream_addr"}';
    access_log /dev/stdout shosai_json;

    server_tokens off;
    # Перенаправления — относительные: внутри контейнера NGINX слушает 8443, снаружи это 443.
    absolute_redirect off;
    sendfile on;
    tcp_nopush on;
    # Простаивающее соединение клиента; к бэкенду — короче его 75 с (backend README, «Stop»).
    keepalive_timeout 65s;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/manifest+json text/plain;

    # §4.3: 50 запросов в секунду и 1 000 соединений с одного адреса; сверх — 429.
    limit_req_zone $binary_remote_addr zone=shosai_per_ip:20m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=shosai_conn_per_ip:20m;
    limit_req_status 429;
    limit_conn_status 429;

    # Заголовок Upgrade превращает прокси-соединение в WebSocket только там, где клиент его просит.
    map $http_upgrade $shosai_connection_upgrade {
        default upgrade;
        "" close;
    }

    include /tmp/nginx/conf.d/*.conf;
}

stream {
    include /tmp/nginx/stream/*.conf;
}
