# Скачивание файла (ADR 0055 п. 8, FL-D9): edge отдаёт байты из бакета дома по подписанной ссылке
# и ставит свои заголовки, которых подписанная ссылка задать не может. Подключается в location
# /dl/{дом}/ после proxy_pass.
limit_except GET HEAD {
    deny all;
}
proxy_http_version 1.1;
proxy_set_header Connection "";
# Host остаётся хостом бакета ($proxy_host): подпись ссылки покрывает его, путь и строку запроса.
# Куки и авторизация кабинета провайдеру хранилища не уходят.
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_verify_depth 4;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
# Файл до гигабайт идёт потоком: без буфера в памяти и на диске edge.
proxy_buffering off;
proxy_max_temp_file_size 0;
proxy_hide_header Set-Cookie;
proxy_hide_header Cache-Control;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
# Байты файла не исполняются: тип не угадывается, документ открывается в песочнице без скриптов,
# без своего origin и без форм; ссылка личная и в кэши не попадает.
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "sandbox" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cache-Control "private, no-store" always;
