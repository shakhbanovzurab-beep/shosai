# Заголовки запроса к процессам плоскости. Edge — первый узел: адрес клиента заменяет, а не
# дописывает X-Forwarded-For, иначе клиент подделал бы свой адрес (лимиты, журнал согласий).
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
# Страну посетителя называет только edge (ADR 0048): заголовок клиента не доходит до бэкенда.
# Пока edge страну не определяет, бэкенд считает её неизвестной — российский набор входа и дом RU.
proxy_set_header X-Country-Code "";
