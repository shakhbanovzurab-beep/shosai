;; PgBouncer дома на staging (F4-D3): пул транзакций роли приложения перед управляемым PostgreSQL.
;; Обе стороны по TLS: приложение проверяет сертификат PgBouncer (внутренний CA staging,
;; sslmode=verify-full), PgBouncer — сертификат кластера Timeweb по его корню и имени хоста.
[pgbouncer]
listen_addr = *
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /run/pgbouncer/userlist.txt
pool_mode = transaction
max_prepared_statements = 0
default_pool_size = 20
max_user_connections = 40
max_client_conn = 1000
idle_transaction_timeout = 60
server_idle_timeout = 300
;; Подключения переиспользуются пулом; строка на каждое — шум, а не аудит (журнал входов — в identity).
log_connections = 0
log_disconnections = 0

client_tls_sslmode = require
client_tls_cert_file = /run/shosai-tls/pgbouncer.crt
client_tls_key_file = /run/shosai-tls/pgbouncer.key
client_tls_protocols = tlsv1.2,tlsv1.3

server_tls_sslmode = verify-full
server_tls_ca_file = /run/shosai-tls/timeweb-ca.crt
server_tls_protocols = tlsv1.2,tlsv1.3

%include /run/pgbouncer/databases.ini
