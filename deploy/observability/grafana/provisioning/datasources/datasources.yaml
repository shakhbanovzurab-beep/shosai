# Источники данных Grafana Shosai и связи между сигналами (target architecture §16.1; план F5 §3.5):
#   панель метрики → трейс через exemplar с trace_id (бэкенд, core/web/http_metrics.py);
#   строка лога → её трейс через trace_id в структурированных метаданных Loki;
#   трейс → его строки в Loki по trace_id в пределах времени трейса.
# Провижининг Grafana подставляет переменные окружения, поэтому переменные самой Grafana — через $$.

apiVersion: 1

prune: true

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 3.15.0
      timeInterval: 15s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        customQuery: true
        query: '{service=~".+"} | trace_id="$${__trace.traceId}"'
      lokiSearch:
        datasourceUid: loki
      nodeGraph:
        enabled: true
