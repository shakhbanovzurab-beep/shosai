# Локальный запуск стека наблюдаемости рядом с compose.dev.yaml (docs/development.md, «Observability»).
#
# Стек входит в сеть локального окружения; отправляются журналы проектов shosai-local и
# shosai-local-*. Порты — только на 127.0.0.1: OTLP для процессов, запущенных через uv,
# и API Loki, Tempo и Prometheus для проверок. Цели проб — локальные (prometheus/targets/local).

services:
  collector:
    environment:
      SHOSAI_LOG_PROJECTS: ^shosai-local(-[a-z]+)?$$
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  loki:
    ports:
      - "127.0.0.1:3100:3100"

  tempo:
    ports:
      - "127.0.0.1:3200:3200"

  prometheus:
    environment:
      SHOSAI_ENVIRONMENT: local
    volumes:
      - ./prometheus/targets/local:/etc/prometheus/targets:ro
    ports:
      - "127.0.0.1:9090:9090"

  # Локально — пароль по умолчанию, только для этой машины (как пароли compose.dev.yaml); файла с
  # хоста нет, вместо его каталога — пустой tmpfs.
  grafana:
    environment:
      GF_SERVER_ROOT_URL: http://127.0.0.1:3000
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SECURITY_ADMIN_PASSWORD__FILE: ""
      GF_SECURITY_ADMIN_PASSWORD: ${LOCAL_GRAFANA_PASSWORD:-local-grafana}
    volumes:
      - type: tmpfs
        target: /run/shosai-grafana
    ports:
      - "127.0.0.1:3000:3000"

networks:
  telemetry:
    name: shosai-local_default
    external: true
