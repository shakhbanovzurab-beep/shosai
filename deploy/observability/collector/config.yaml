# OpenTelemetry Collector Shosai: один конвейер логов и трейсов (target architecture §16.1, план F5 §3.2–3.3).
#
# Логи: строки контейнеров из json-file Docker. Отправляются только контейнеры, чьи строки несут
# метки Compose (опция журнала `labels`) и чей проект совпадает с SHOSAI_LOG_PROJECTS: на одной машине
# живут и staging, и локальное окружение, и их журналы не смешиваются. Метки Loki — только service,
# role, level, home (§16.7); идентификаторы — в структурированные метаданные; тело — исходная строка.
#
# Трейсы: OTLP от процессов; хвостовая выборка держит все трейсы с ошибкой, все медленные HTTP-запросы
# и 5% остальных.
#
# Ни одна очередь не ждёт: memory_limiter первым отказывает при нехватке памяти, очереди экспортёров
# ограничены и при переполнении отбрасывают; отказы и потери считает сам коллектор (метрики на :8888).

extensions:
  # Смещения в файлах журналов: после перезапуска коллектор не шлёт строки повторно.
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: false

receivers:
  file_log/containers:
    include:
      - /var/lib/docker/containers/*/*-json.log
    # Файлы, найденные при первом проходе, читаются с конца; новые контейнеры — с начала.
    start_at: end
    include_file_name: false
    include_file_path: true
    poll_interval: 500ms
    max_log_size: 1MiB
    storage: file_storage
    operators:
      # Обёртка json-file: {"log": "...\n", "stream": "...", "attrs": {...}, "time": "..."}.
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          layout_type: gotime
          layout: "2006-01-02T15:04:05.999999999Z07:00"
      # Строки длиннее 16 КиБ Docker режет на части без перевода строки в конце; собираем обратно.
      - type: recombine
        combine_field: attributes.log
        combine_with: ""
        is_last_entry: 'attributes.log endsWith "\n"'
        max_log_size: 1MiB

  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # Только контейнеры своих проектов Compose; строки без меток Compose не отправляются.
  filter/projects:
    error_mode: ignore
    logs:
      log_record:
        - not IsMatch(log.attributes["attrs"]["com.docker.compose.project"], "${env:SHOSAI_LOG_PROJECTS}")

  transform/container_lines:
    error_mode: ignore
    log_statements:
      - statements:
          - set(log.body, log.attributes["log"])
          - replace_pattern(log.body, "\\n$", "")
          - set(log.attributes["service"], log.attributes["attrs"]["com.docker.compose.service"])
          # Строка процесса бэкенда — JSON (core/observability/logs.py); у остальных служб — текст.
          - merge_maps(log.cache, ParseJSON(log.body), "upsert") where IsMatch(log.body, "^\\{")
          - set(log.attributes["role"], log.cache["role"]) where log.cache["role"] != nil
          - set(log.attributes["home"], log.cache["home"]) where log.cache["home"] != nil
          - set(log.attributes["level"], log.cache["level"]) where log.cache["level"] != nil
          - set(log.severity_text, log.cache["level"]) where log.cache["level"] != nil
          - set(log.severity_number, SEVERITY_NUMBER_DEBUG) where log.cache["level"] == "debug"
          - set(log.severity_number, SEVERITY_NUMBER_INFO) where log.cache["level"] == "info"
          - set(log.severity_number, SEVERITY_NUMBER_WARN) where log.cache["level"] == "warning"
          - set(log.severity_number, SEVERITY_NUMBER_ERROR) where log.cache["level"] == "error"
          - set(log.severity_number, SEVERITY_NUMBER_FATAL) where log.cache["level"] == "critical"
          # Идентификаторы — только из строк бэкенда (есть role) и edge (есть path_class): у Loki, Tempo
          # и Grafana в JSON бывают поля с теми же именами и другим смыслом. У нетрассируемых локаций
          # edge trace_id пустой.
          - set(log.trace_id.string, log.cache["trace_id"]) where log.cache["trace_id"] != nil and (log.cache["role"] != nil or log.cache["path_class"] != nil) and log.cache["trace_id"] != ""
          - set(log.span_id.string, log.cache["span_id"]) where log.cache["span_id"] != nil and (log.cache["role"] != nil or log.cache["path_class"] != nil) and log.cache["span_id"] != ""
          # error_log NGINX — текст с адресом клиента и сырым запросом, параметры включительно (§16.8).
          - 'replace_pattern(log.body, "client: [^,]+", "client: <hidden>") where log.attributes["service"] == "edge"'
          - 'replace_pattern(log.body, "request: \"[^\"]*\"", "request: <hidden>") where log.attributes["service"] == "edge"'
          - 'replace_pattern(log.body, "upstream: \"[^\"]*\"", "upstream: <hidden>") where log.attributes["service"] == "edge"'
          - 'replace_pattern(log.body, "referrer: \"[^\"]*\"", "referrer: <hidden>") where log.attributes["service"] == "edge"'
          - set(log.attributes["request_id"], log.cache["request_id"]) where log.cache["request_id"] != nil and (log.cache["role"] != nil or log.cache["path_class"] != nil)
          - set(log.attributes["user_id"], log.cache["user_id"]) where log.cache["user_id"] != nil and (log.cache["role"] != nil or log.cache["path_class"] != nil)
          - set(log.attributes["org_id"], log.cache["org_id"]) where log.cache["org_id"] != nil and (log.cache["role"] != nil or log.cache["path_class"] != nil)
          - set(log.attributes["session_id"], log.cache["session_id"]) where log.cache["session_id"] != nil and (log.cache["role"] != nil or log.cache["path_class"] != nil)
          - set(log.attributes["task_id"], log.cache["task_id"]) where log.cache["task_id"] != nil and (log.cache["role"] != nil or log.cache["path_class"] != nil)
          - set(log.attributes["event_id"], log.cache["event_id"]) where log.cache["event_id"] != nil and (log.cache["role"] != nil or log.cache["path_class"] != nil)
          # Закрытый список: метки и идентификаторы; всё прочее остаётся только в теле строки.
          - keep_keys(log.attributes, ["service", "role", "level", "home", "request_id", "user_id", "org_id", "session_id", "task_id", "event_id"])

  # Последний рубеж (§16.8): значения вида адреса почты, JWT, bearer-токена и пароля в адресе
  # маскируются в строках, атрибутах, именах и событиях спанов, какой бы процесс их ни написал.
  # Источники их не пишут — это проверяют тест приватности бэкенда (tests/features/identity/
  # test_telemetry_privacy.py) и checks/privacy-canary.sh; здесь — на случай, если источник ошибся.
  transform/mask_personal_values:
    error_mode: ignore
    log_statements:
      - statements:
          - 'replace_pattern(log.body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,}", "<email>")'
          - 'replace_pattern(log.body, "eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}", "<jwt>")'
          - 'replace_pattern(log.body, "(?i)bearer\\s+[A-Za-z0-9._~+/=-]{8,}", "Bearer <token>")'
          - 'replace_pattern(log.body, "://[^:/@\\s\"]+:[^@\\s/\"]+@", "://<credentials>@")'
          - 'replace_all_patterns(log.attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,}", "<email>")'
          - 'replace_all_patterns(log.attributes, "value", "eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}", "<jwt>")'
          - 'replace_all_patterns(log.attributes, "value", "(?i)bearer\\s+[A-Za-z0-9._~+/=-]{8,}", "Bearer <token>")'
          - 'replace_all_patterns(log.attributes, "value", "://[^:/@\\s\"]+:[^@\\s/\"]+@", "://<credentials>@")'
    trace_statements:
      - statements:
          - 'replace_pattern(span.name, "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,}", "<email>")'
          - 'replace_pattern(span.name, "eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}", "<jwt>")'
          - 'replace_pattern(span.name, "(?i)bearer\\s+[A-Za-z0-9._~+/=-]{8,}", "Bearer <token>")'
          - 'replace_pattern(span.name, "://[^:/@\\s\"]+:[^@\\s/\"]+@", "://<credentials>@")'
          - 'replace_all_patterns(span.attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,}", "<email>")'
          - 'replace_all_patterns(span.attributes, "value", "eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}", "<jwt>")'
          - 'replace_all_patterns(span.attributes, "value", "(?i)bearer\\s+[A-Za-z0-9._~+/=-]{8,}", "Bearer <token>")'
          - 'replace_all_patterns(span.attributes, "value", "://[^:/@\\s\"]+:[^@\\s/\"]+@", "://<credentials>@")'
      - statements:
          - 'replace_all_patterns(spanevent.attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,}", "<email>")'
          - 'replace_all_patterns(spanevent.attributes, "value", "eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}", "<jwt>")'
          - 'replace_all_patterns(spanevent.attributes, "value", "(?i)bearer\\s+[A-Za-z0-9._~+/=-]{8,}", "Bearer <token>")'
          - 'replace_all_patterns(spanevent.attributes, "value", "://[^:/@\\s\"]+:[^@\\s/\"]+@", "://<credentials>@")'

  # Метки Loki переезжают в ресурс: строки группируются по service, role, level, home.
  groupbyattrs/loki_labels:
    keys:
      - service
      - role
      - level
      - home

  # Атрибуты, в которых бывает ввод пользователя: адрес клиента, его user agent, сырые путь и запрос
  # (§16.8). Бэкенд их не пишет (core/observability/span_privacy.py); edge NGINX пишет по умолчанию.
  transform/private_span_attributes:
    error_mode: ignore
    trace_statements:
      - statements:
          - delete_matching_keys(span.attributes, "^(url\\.(full|path|query)|http\\.(url|target|user_agent|client_ip)|client\\.(address|port)|net\\.(peer\\.(ip|port)|sock\\.peer\\.(addr|port))|user_agent\\.original)$")

  tail_sampling:
    decision_wait: 10s
    num_traces: 20000
    expected_new_traces_per_sec: 100
    # Поздние спаны уже решённого трейса идут за решением, а не за новой монетой.
    decision_cache:
      sampled_cache_size: 20000
      non_sampled_cache_size: 50000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      # Порог — цель p95 API кабинета (§16.3); тот же, что SLOW_REQUEST_SECONDS у exemplars HTTP-метрики
      # (backend core/web/http_metrics.py): меняются только вместе. Пороги по маршрутам — с SLO (шаг 5).
      - name: slow-http-requests
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          span:
            - span.kind.string == "Server" and span.attributes["http.route"] != nil and span.end_time_unix_nano - span.start_time_unix_nano > 300000000
      - name: everything-else
        type: probabilistic
        probabilistic:
          sampling_percentage: 5

  batch:
    timeout: 2s
    send_batch_size: 2048
    send_batch_max_size: 4096

exporters:
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    timeout: 10s
    sending_queue:
      enabled: true
      sizer: items
      queue_size: 20000
      num_consumers: 2
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s

  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    timeout: 10s
    sending_queue:
      enabled: true
      sizer: items
      queue_size: 20000
      num_consumers: 2
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s

service:
  extensions: [file_storage]
  telemetry:
    logs:
      level: info
      encoding: json
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    logs:
      receivers: [file_log/containers]
      processors: [memory_limiter, filter/projects, transform/container_lines, transform/mask_personal_values, groupbyattrs/loki_labels, batch]
      exporters: [otlp_http/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/private_span_attributes, transform/mask_personal_values, tail_sampling, batch]
      exporters: [otlp_grpc/tempo]
