# Стек наблюдаемости Shosai (target architecture §16, план F5 docs/plan/packages/F5-observability.md).
#
# Один и тот же файл служит локально (с compose.local.yaml) и на staging (план F5 §3.1, шаг 10).
# Стек подключается к сети плоскости, имя которой задаёт SHOSAI_TELEMETRY_NETWORK; журналы каких
# проектов Compose отправлять, задаёт SHOSAI_LOG_PROJECTS (README рядом).
#
# У Loki, коллектора и nginx-экспортёра в образах нет ни оболочки, ни команды проверки здоровья:
# их живость Prometheus видит по `up`. У Tempo проверка своя (`-health`), у остальных — wget образа.

x-telemetry-defaults: &telemetry-defaults
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Ротация (§14 правило 11) и метки Compose в каждой строке: по ним коллектор узнаёт службу.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      labels: "com.docker.compose.project,com.docker.compose.service"
  networks:
    - telemetry

services:
  # Тома Loki и Tempo создаются владельцем root, а оба процесса работают от 10001; оболочки в их
  # образах нет. Один запуск отдаёт тома процессам и завершается.
  telemetry-volumes:
    image: busybox:1.37.0
    restart: "no"
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    command: ["chown", "10001:10001", "/loki", "/tempo"]
    volumes:
      - loki-data:/loki
      - tempo-data:/tempo

  collector:
    <<: *telemetry-defaults
    image: otel/opentelemetry-collector-contrib:0.162.0
    # Журналы контейнеров принадлежат root: процесс — root без единой возможности, кроме чтения
    # чужих файлов (DAC_READ_SEARCH); сокет Docker не монтируется.
    user: "0:0"
    cap_add:
      - DAC_READ_SEARCH
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      SHOSAI_LOG_PROJECTS: ${SHOSAI_LOG_PROJECTS:-^shosai-staging$$}
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - collector-storage:/var/lib/otelcol/file_storage
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m

  loki:
    <<: *telemetry-defaults
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    tmpfs:
      - /tmp
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    depends_on:
      telemetry-volumes:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 320m

  tempo:
    <<: *telemetry-defaults
    image: grafana/tempo:3.1.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    tmpfs:
      - /tmp
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "/tempo", "-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_interval: 2s
      start_period: 60s
    depends_on:
      telemetry-volumes:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 320m

  prometheus:
    <<: *telemetry-defaults
    image: prom/prometheus:v3.15.0
    # Хранение — 30 дней или до потолка размера, что наступит раньше (§16.1, F5-D3).
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
      - --enable-feature=exemplar-storage
    environment:
      SHOSAI_ENVIRONMENT: ${SHOSAI_ENVIRONMENT:-staging}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${SHOSAI_PROBE_TARGETS_DIR:-/srv/shosai/telemetry/probe-targets}:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_interval: 2s
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384m

  # Хост: диски, память, процессор (тикет диска на 80% — §14 правило 11). Корень хоста — только
  # на чтение. Сетевые счётчики выключены: в сети контейнера они показывали бы только её.
  node-exporter:
    <<: *telemetry-defaults
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+|var/lib/containerd/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|pstore|securityfs|squashfs|sysfs|tracefs|tmpfs)$$
      - --no-collector.netdev
      - --no-collector.netstat
      - --no-collector.netclass
      - --no-collector.sockstat
      - --no-collector.arp
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_interval: 2s
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 48m

  # Соединения edge из stub_status на внутреннем порту 8082. Оболочки в образе нет.
  nginx-exporter:
    <<: *telemetry-defaults
    image: nginx/nginx-prometheus-exporter:1.5.3
    command: ["--nginx.scrape-uri=http://edge:8082/stub_status"]
    deploy:
      resources:
        limits:
          memory: 32m

  blackbox:
    <<: *telemetry-defaults
    image: prom/blackbox-exporter:v0.28.0
    # Образ по умолчанию запускается от root; пробам HTTP и TCP права не нужны.
    user: "65534:65534"
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_interval: 2s
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 32m

  # Одно окно на метрики, логи и трейсы (§16.1). Вход — один администратор (F5-D1), пароль из файла
  # на хосте; регистрация, анонимный доступ и своё оповещение Grafana выключены: оповещает Alertmanager.
  grafana:
    <<: *telemetry-defaults
    image: grafana/grafana:13.2.4
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.shosai.tech}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/shosai-grafana/admin-password
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
      # Сборщик мусора Go держит кучу ниже лимита контейнера: при 192 МБ Grafana 13 убивал OOM.
      GOMEMLIMIT: 300MiB
    tmpfs:
      - /tmp
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
      - ${GRAFANA_SECRETS_DIR:-/srv/shosai/secrets/grafana}:/run/shosai-grafana:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_interval: 2s
      start_period: 60s
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 384m

volumes:
  grafana-data:
  collector-storage:
  loki-data:
  tempo-data:
  prometheus-data:

networks:
  telemetry:
    name: ${SHOSAI_TELEMETRY_NETWORK:-shosai-staging_plane}
    external: true
