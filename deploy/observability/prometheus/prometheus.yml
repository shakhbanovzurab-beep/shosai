# Prometheus Shosai (target architecture §16.1, §16.7; план F5 §3.7).
#
# Метки ограничены: роль, очередь, дом, проба. Пользователи, компании и сессии в метки не попадают.
# Каждую роль бэкенда Prometheus находит по DNS Docker: во время передачи выкладки за именем службы
# стоят два контейнера, и опрашиваются оба. Правила (шаг 5) агрегируют по экземплярам явно.
# Метки цели — job, instance, role, service (служба Compose, как метка service в Loki); у метрик
# бэкенда таких меток нет, иначе Prometheus переименует их в exported_* (тест каталога это ловит).
# Конфигурация перечитывается по SIGHUP; HTTP-API жизненного цикла выключен.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: ${SHOSAI_ENVIRONMENT}

# Тикеты пишутся руками (rules/tickets.yml), цели и мониторы рендерятся из кода бэкенда
# (rules/generated, F5 план §3.8); тесты promtool лежат рядом и правилами не загружаются.
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/rules/generated/*.recording.json
  - /etc/prometheus/rules/generated/*.alerts.json

scrape_configs:
  # --- Роли бэкенда: служебный порт OPS_PORT каждой роли (core/web/ops.py) ---
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 9100
        refresh_interval: 15s
    relabel_configs:
      - target_label: role
        replacement: api
      - source_labels: [__meta_dns_name]
        target_label: service

  - job_name: ws
    dns_sd_configs:
      - names: [ws]
        type: A
        port: 9100
        refresh_interval: 15s
    relabel_configs:
      - target_label: role
        replacement: ws
      - source_labels: [__meta_dns_name]
        target_label: service

  - job_name: workers
    dns_sd_configs:
      - names: [workers-critical, workers-default, workers-bulk, workers-meeting, workers-agent]
        type: A
        port: 9100
        refresh_interval: 15s
    relabel_configs:
      - target_label: role
        replacement: workers
      - source_labels: [__meta_dns_name]
        target_label: service

  - job_name: scheduler
    dns_sd_configs:
      - names: [scheduler]
        type: A
        port: 9100
        refresh_interval: 15s
    relabel_configs:
      - target_label: role
        replacement: scheduler
      - source_labels: [__meta_dns_name]
        target_label: service

  # --- Сам стек ---
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: collector
    static_configs:
      - targets: [collector:8888]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]

  - job_name: blackbox
    static_configs:
      - targets: [blackbox:9115]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  # --- Хост и edge ---
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: nginx
    static_configs:
      - targets: [nginx-exporter:9113]

  # --- LiveKit (meetings A8): узлы, трафик и история для экрана администратора ---
  # Цели — файлы каталога targets/livekit: локальная лежит в репозитории, на staging файл
  # рендерит хост, когда выкладывается LiveKit (meetings A15); нет файла — нет цели, и экран
  # показывает «нет данных». Метки service нет: у метрик LiveKit своя метка service.
  - job_name: livekit
    file_sd_configs:
      - files: [/etc/prometheus/targets/livekit/*.yml]

  # Egress (meetings A15): память и готовность записи; цели — как у LiveKit, свой каталог.
  - job_name: egress
    file_sd_configs:
      - files: [/etc/prometheus/targets/egress/*.yml]

  # --- Пробы изнутри плоскости; внешние пробы — UptimeRobot (F5-D2) ---
  # Цели и модули — в файлах каталога targets: локальные лежат в репозитории, цели staging
  # (адреса баз домов) рендерятся на хосте.
  - job_name: probes
    metrics_path: /probe
    scrape_interval: 30s
    file_sd_configs:
      - files: [/etc/prometheus/targets/*.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
