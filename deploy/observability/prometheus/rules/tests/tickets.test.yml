# Каждый тикет tickets.yml срабатывает и снимается (promtool test rules).
rule_files:
  - ../tickets.yml
evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{fstype="ext4",mountpoint="/"}'
        values: "50x5 10x20 50x20"
      - series: 'node_filesystem_size_bytes{fstype="ext4",mountpoint="/"}'
        values: "100x45"
    alert_rule_test:
      - eval_time: 20m
        alertname: HostDiskFilling
        exp_alerts:
          - exp_labels: {severity: ticket, fstype: ext4, mountpoint: /}
            exp_annotations:
              summary: "Место на сервере заканчивается"
              description: "Диск / заполнен больше чем на 80 %. Когда место кончится, сервис перестанет сохранять данные."
              runbook: docs/runbooks/alerts.md#host-disk-filling
      - eval_time: 40m
        alertname: HostDiskFilling
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'shosai_db_pool_connections{state="in_use",home="ru",instance="a"}'
        values: "1x5 8x20 1x20"
      - series: 'shosai_db_pool_capacity{home="ru",instance="a"}'
        values: "10x45"
    alert_rule_test:
      - eval_time: 20m
        alertname: DatabasePoolBusy
        exp_alerts:
          - exp_labels: {severity: ticket, home: ru}
            exp_annotations:
              summary: "База данных в России перегружена подключениями"
              description: "Сервер держит занятыми больше 70 % подключений к базе. Если они кончатся, запросы людей начнут ждать и падать."
              runbook: docs/runbooks/alerts.md#database-pool-busy
      - eval_time: 40m
        alertname: DatabasePoolBusy
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'shosai_ai_provider_slots_total{provider="openrouter",decision="full"}'
        values: "0x5 1x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: ProviderSlotsExhausted
        exp_alerts:
          - exp_labels: {severity: ticket, provider: openrouter}
            exp_annotations:
              summary: "Провайдер ИИ openrouter не успевает отвечать"
              description: "Все разрешённые одновременные запросы к нему заняты, новые ждут очереди или получают отказ. Люди ждут ответов ИИ дольше обычного."
              runbook: docs/runbooks/alerts.md#provider-slots-exhausted
      - eval_time: 40m
        alertname: ProviderSlotsExhausted
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'shosai_notes_oldest_open_run_seconds{home="ru"}'
        values: "0x5 900x20 0x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: MeetingRunOld
        exp_alerts:
          - exp_labels: {severity: ticket, home: ru}
            exp_annotations:
              summary: "Обработка встречи идёт дольше 10 минут"
              description: "Самый старый незаконченный прогон встречи в России идёт дольше 10 минут: заметки к встрече запаздывают."
              runbook: docs/runbooks/alerts.md#meeting-run-old
      - eval_time: 40m
        alertname: MeetingRunOld
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'shosai_task_queue_oldest_age_seconds{queue="default"}'
        values: "0x5 900x20 0x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: TaskQueueOld
        exp_alerts:
          - exp_labels: {severity: ticket, queue: default}
            exp_annotations:
              summary: "Фоновые задачи выполняются с задержкой больше 10 минут"
              description: "В очереди «default» задача ждёт выполнения дольше 10 минут: письма, обработка и другая фоновая работа запаздывают."
              runbook: docs/runbooks/alerts.md#task-queue-old
      - eval_time: 40m
        alertname: TaskQueueOld
        exp_alerts: []

  # Отметка успеха идёт вровень со временем, с 6-й минуты стоит на 300 с, с 32-й снова идёт.
  - interval: 1m
    input_series:
      - series: 'shosai_loop_last_success_timestamp_seconds{shosai_loop_name="email.sweep.ru"}'
        values: "0+60x5 300x25 1920+60x20"
      - series: 'shosai_loop_interval_seconds{shosai_loop_name="email.sweep.ru"}'
        values: "5x52"
    alert_rule_test:
      - eval_time: 25m
        alertname: SchedulerLoopStalled
        exp_alerts:
          - exp_labels: {severity: ticket, shosai_loop_name: email.sweep.ru}
            exp_annotations:
              summary: "Регулярная внутренняя работа сервера остановилась"
              description: "Повторяющаяся задача «email.sweep.ru» давно не завершалась успешно. То, что она делает (рассылки, очистка, синхронизация), сейчас не происходит."
              runbook: docs/runbooks/alerts.md#scheduler-loop-stalled
      - eval_time: 40m
        alertname: SchedulerLoopStalled
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'shosai_db_home_state{home="ru",shosai_db_home_state="unreachable"}'
        values: "0x5 1x10 0x20"
    alert_rule_test:
      - eval_time: 14m
        alertname: HomeUnreachableFromApp
        exp_alerts:
          - exp_labels: {severity: ticket, home: ru}
            exp_annotations:
              summary: "Сервер не может связаться с базой данных в России"
              description: "Люди, чьи данные хранятся в этой базе, сейчас получают ошибку при каждом действии."
              runbook: docs/runbooks/alerts.md#home-unreachable-from-app
      - eval_time: 30m
        alertname: HomeUnreachableFromApp
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'shosai_telemetry_dropped_total{signal="logs",reason="queue_full"}'
        values: "0x5 3x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: TelemetryDropped
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "Часть записей мониторинга потеряна"
              description: "Журналы или трассировки не дошли до хранилища — на графиках и в журналах могут быть пробелы. На работу сервиса для людей это не влияет."
              runbook: docs/runbooks/alerts.md#telemetry-dropped
      - eval_time: 40m
        alertname: TelemetryDropped
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'otelcol_exporter_send_failed_log_records{exporter="otlp_http/loki"}'
        values: "0x5 10x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: TelemetryDropped
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "Часть записей мониторинга потеряна"
              description: "Журналы или трассировки не дошли до хранилища — на графиках и в журналах могут быть пробелы. На работу сервиса для людей это не влияет."
              runbook: docs/runbooks/alerts.md#telemetry-dropped
      - eval_time: 40m
        alertname: TelemetryDropped
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{job="api",instance="a:9100"}'
        values: "1x5 0x10 1x20"
    alert_rule_test:
      - eval_time: 14m
        alertname: ScrapeTargetDown
        exp_alerts:
          - exp_labels: {severity: ticket, job: api, instance: "a:9100"}
            exp_annotations:
              summary: "Мониторинг не может опросить службу api"
              description: "Служба 5 минут не отвечает на запросы мониторинга: она остановилась или зависла."
              runbook: docs/runbooks/alerts.md#scrape-target-down
      - eval_time: 30m
        alertname: ScrapeTargetDown
        exp_alerts: []

  # Роли ws нет первые 20 минут, остальные есть всё время.
  - interval: 1m
    input_series:
      - series: 'up{job="api",service="api",instance="a"}'
        values: "1x40"
      - series: 'up{job="ws",service="ws",instance="w"}'
        values: "_x20 1x20"
      - series: 'up{job="scheduler",service="scheduler",instance="s"}'
        values: "1x40"
      - series: 'up{job="workers",service="workers-critical",instance="c"}'
        values: "1x40"
      - series: 'up{job="workers",service="workers-default",instance="d"}'
        values: "1x40"
      - series: 'up{job="workers",service="workers-bulk",instance="b"}'
        values: "1x40"
      - series: 'up{job="workers",service="workers-meeting",instance="m"}'
        values: "1x40"
      - series: 'up{job="workers",service="workers-agent",instance="g"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 15m
        alertname: RoleMissing
        exp_alerts:
          - exp_labels: {severity: ticket, service: ws}
            exp_annotations:
              summary: "Служба ws не запущена"
              description: "Ни одного процесса этой службы нет уже 10 минут — её часть работы сервиса не выполняется."
              runbook: docs/runbooks/alerts.md#role-missing
      - eval_time: 35m
        alertname: RoleMissing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'probe_success{probe="edge_health",instance="https://edge"}'
        values: "1x5 0x10 1x20"
      - series: 'probe_ssl_earliest_cert_expiry{probe="edge_health",instance="https://edge"}'
        values: "2592000x5 864000x15 2592000x20"
      - series: 'probe_success{probe="home_database",home="eu",instance="db:5432"}'
        values: "1x5 0x10 1x20"
      - series: 'probe_duration_seconds{probe="home_database",home="ru",instance="db:5432"}'
        values: "0.05x5 0.4x20 0.05x20"
    alert_rule_test:
      - eval_time: 12m
        alertname: EdgeHealthFailing
        exp_alerts:
          - exp_labels: {severity: ticket, probe: edge_health, instance: "https://edge"}
            exp_annotations:
              summary: "Сайт не отвечает"
              description: "Проверка изнутри сервера 3 минуты не получает ответа от сайта. Если внешняя проверка UptimeRobot тоже прислала тревогу — люди не могут пользоваться сервисом."
              runbook: docs/runbooks/alerts.md#edge-health-failing
      - eval_time: 30m
        alertname: EdgeHealthFailing
        exp_alerts: []
      - eval_time: 10m
        alertname: CertificateExpiresSoon
        exp_alerts:
          - exp_labels: {severity: ticket, probe: edge_health, instance: "https://edge"}
            exp_annotations:
              summary: "Сертификат HTTPS сайта скоро истечёт"
              description: "До конца сертификата меньше 21 дня, а автоматическое продление его не обновило. После истечения браузеры покажут предупреждение, что сайт небезопасен."
              runbook: docs/runbooks/alerts.md#certificate-expires-soon
      - eval_time: 30m
        alertname: CertificateExpiresSoon
        exp_alerts: []
      - eval_time: 12m
        alertname: HomeDatabaseUnreachable
        exp_alerts:
          - exp_labels: {severity: ticket, probe: home_database, home: eu, instance: "db:5432"}
            exp_annotations:
              summary: "База данных в ЕС не отвечает"
              description: "Сервер 5 минут не может даже установить с ней соединение."
              runbook: docs/runbooks/alerts.md#home-database-unreachable
      - eval_time: 30m
        alertname: HomeDatabaseUnreachable
        exp_alerts: []
      - eval_time: 22m
        alertname: RussianHomeLinkSlow
        exp_alerts:
          - exp_labels: {severity: ticket, probe: home_database, home: ru, instance: "db:5432"}
            exp_annotations:
              summary: "Связь с базой данных в России медленная"
              description: "Соединение с ней 15 минут занимает больше 0,25 секунды, поэтому у людей, чьи данные хранятся в России, всё работает медленнее."
              runbook: docs/runbooks/alerts.md#russian-home-link-slow
      - eval_time: 40m
        alertname: RussianHomeLinkSlow
        exp_alerts: []

  - interval: 1h
    input_series:
      - series: 'shosai_agent_turns_total{channel="web",outcome="answered"}'
        values: "0+10x60"
      - series: 'shosai_agent_load_toolset_total'
        values: "0+1x24 24x36"
    alert_rule_test:
      - eval_time: 20h
        alertname: LeoToolsetLoadsFrequent
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "Leo часто догружает наборы инструментов"
              description: "Больше чем в 5 % ходов за сутки модели пришлось загрузить набор инструментов, который маршрутизация не предложила. Каждая загрузка стоит лишнего раунда: ответы Leo приходят медленнее и дороже."
              runbook: docs/runbooks/alerts.md#leo-toolset-loads-frequent
      - eval_time: 55h
        alertname: LeoToolsetLoadsFrequent
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'shosai_memory_admission_lag_seconds_bucket{le="60"}'
        values: "0x45 0+10x30"
      - series: 'shosai_memory_admission_lag_seconds_bucket{le="120"}'
        values: "0+10x75"
      - series: 'shosai_memory_admission_lag_seconds_bucket{le="+Inf"}'
        values: "0+10x75"
    alert_rule_test:
      - eval_time: 40m
        alertname: MemoryAdmissionSlow
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "Память Leo разбирает ходы медленно"
              description: "Полчаса подряд 5 % ходов память разбирает дольше минуты. Строка «Leo может запомнить» под ответом появляется с опозданием, новые факты попадают в ответы позже."
              runbook: docs/runbooks/alerts.md#memory-admission-slow
      - eval_time: 70m
        alertname: MemoryAdmissionSlow
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'shosai_memory_extractions_total{source="user_statement",outcome="ok"}'
        values: "0+19x125"
      - series: 'shosai_memory_extractions_total{source="user_statement",outcome="failed"}'
        values: "0+1x30 35+5x60 335+0x30"
    alert_rule_test:
      - eval_time: 75m
        alertname: MemoryExtractionFailing
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "Память Leo не может разобрать ходы и встречи"
              description: "Больше 5 % обращений памяти к модели за полчаса заканчиваются сбоем. Задачи повторяются, но то, что человек просил запомнить, может не сохраниться."
              runbook: docs/runbooks/alerts.md#memory-extraction-failing
      - eval_time: 125m
        alertname: MemoryExtractionFailing
        exp_alerts: []

  - interval: 1h
    input_series:
      - series: 'shosai_memory_candidates_total{source="user_statement",answer="accepted"}'
        values: "0+1x200 220+20x600"
      - series: 'shosai_memory_candidates_total{source="user_statement",answer="turned_down"}'
        values: "0+3x800"
      # Перенесённые кандидаты, отклонённые списком, — не отбор Leo: тикет их не считает.
      - series: 'shosai_memory_candidates_total{source="imported",answer="turned_down"}'
        values: "0+50x800"
    alert_rule_test:
      - eval_time: 72h
        alertname: MemoryCandidatesTurnedDown
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "Люди отклоняют больше трети того, что Leo предлагает запомнить"
              description: "За четыре недели меньше 70 % ответов на «Запомнить?» — «Запомнить». Leo предлагает лишнее и отнимает внимание людей; отбор кандидатов стоит пересмотреть."
              runbook: docs/runbooks/alerts.md#memory-candidates-turned-down
      - eval_time: 700h
        alertname: MemoryCandidatesTurnedDown
        exp_alerts: []

  - interval: 1h
    input_series:
      - series: 'shosai_studio_catalogue_refresh_total{outcome="done"}'
        values: "0 1 1+0x60"
    alert_rule_test:
      - eval_time: 30h
        alertname: StudioCatalogueRefreshStale
        exp_alerts: []
      - eval_time: 52h
        alertname: StudioCatalogueRefreshStale
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "Каталог моделей двое суток не сверялся с OpenRouter"
              description: "Ежедневная сверка каталога studio двое суток не закончилась: список OpenRouter не читается или в нём не хватает доли каталога. Модели живут со вчерашним описанием; выключенных и предложений уровня нет."
              runbook: docs/runbooks/alerts.md#studio-catalogue-refresh-stale

  - interval: 1h
    input_series:
      - series: 'shosai_studio_broken_defaults_total{reason="unlisted"}'
        values: "0 0 1 1+0x40"
      - series: 'shosai_studio_waiting_tier_proposals_total'
        values: "0 0 0 2 2+0x40"
    alert_rule_test:
      - eval_time: 4h
        alertname: StudioDefaultBroken
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "Модель по умолчанию одной из ролей не может отвечать"
              description: "Сверка каталога нашла умолчание или запасную модель роли, которой нет в списке OpenRouter или которая больше не читает нужное роли. Роль отвечает запасной моделью, а без неё — ошибкой. Назначьте другое умолчание на экране AI-моделей."
              runbook: docs/runbooks/alerts.md#studio-default-broken
      - eval_time: 40h
        alertname: StudioDefaultBroken
        exp_alerts: []
      - eval_time: 5h
        alertname: StudioTierProposalWaiting
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "Предложение уровня модели ждёт админа больше трёх дней"
              description: "Цена модели предложила другой уровень, а решения нет. Пока его нет, модель считается в прежнем уровне — в лимитах людей и в расходах платформы. Подтвердите или отклоните предложение на экране AI-моделей."
              runbook: docs/runbooks/alerts.md#studio-tier-proposal-waiting
      - eval_time: 40h
        alertname: StudioTierProposalWaiting
        exp_alerts: []

  - interval: 5m
    input_series:
      - series: 'shosai_studio_role_unconfigured_total{studio_role="notes"}'
        values: "0 0 1 1+0x20"
      - series: 'shosai_studio_resolution_seconds_count{studio_role="code"}'
        values: "0+10x30"
      - series: 'shosai_studio_route_substitutions_total{studio_role="code",reason="not_on_plan"}'
        values: "0+1x30"
      - series: 'shosai_studio_resolution_seconds_count{studio_role="notes"}'
        values: "0+1x30"
      - series: 'shosai_studio_route_substitutions_total{studio_role="notes",reason="disabled"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: StudioRoleUnconfigured
        exp_alerts:
          - exp_labels: {severity: ticket, studio_role: notes}
            exp_annotations:
              summary: "Роль notes осталась без модели по умолчанию"
              description: "Запросы роли получают model_role_unconfigured (503): у неё нет умолчания и запасной модели, которые могут ответить. Назначьте роли умолчание на экране AI-моделей."
              runbook: docs/runbooks/alerts.md#studio-role-unconfigured
      - eval_time: 90m
        alertname: StudioRoleUnconfigured
        exp_alerts: []
      - eval_time: 90m
        alertname: StudioSubstitutionsHigh
        exp_alerts:
          - exp_labels: {severity: ticket, studio_role: code, reason: not_on_plan}
            exp_annotations:
              summary: "В роли code выбор людей часто не отвечает: not_on_plan"
              description: "Больше 5 % разрешений роли за час отвечают моделью по умолчанию вместо выбранной людьми. Причина — в метке reason: модель выключена, убрана из каталога, не умеет нужного роли или не входит в тариф."
              runbook: docs/runbooks/alerts.md#studio-substitutions-high

  # Память сервера (meetings A15).
  - interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="node"}'
        values: "50x5 5x20 50x20"
      - series: 'node_memory_MemTotal_bytes{instance="node"}'
        values: "100x45"
    alert_rule_test:
      - eval_time: 20m
        alertname: HostMemoryLow
        exp_alerts:
          - exp_labels: {severity: ticket, instance: node}
            exp_annotations:
              summary: "Память сервера на исходе"
              description: "Свободной памяти меньше 10 % уже 10 минут. Когда она кончится, сервер начнёт останавливать службы, а под сильным давлением может перезагрузиться."
              runbook: docs/runbooks/alerts.md#host-memory-low
      - eval_time: 40m
        alertname: HostMemoryLow
        exp_alerts: []

  # Звонки (meetings A15): вход снаружи, память LiveKit и egress, подпись вебхуков.
  - interval: 1m
    input_series:
      - series: 'probe_success{probe="rtc_signal",instance="https://rtc"}'
        values: "1x5 0x10 1x20"
      - series: 'probe_success{probe="turn_tls",instance="turn:443"}'
        values: "1x5 0x10 1x20"
      - series: 'process_resident_memory_bytes{job="livekit",instance="livekit:6789"}'
        values: "100x5 500x20 100x20"
      - series: 'go_gc_gomemlimit_bytes{job="livekit",instance="livekit:6789"}'
        values: "460x45"
      - series: 'livekit_egress_cgroup_memory_bytes{job="egress",instance="livekit:9090"}'
        values: "100000000x5 1000000000x20 100000000x20"
      - series: 'shosai_meetings_webhook_verifications_total{outcome="accepted",instance="api"}'
        values: "0+10x45"
      - series: 'shosai_meetings_webhook_verifications_total{outcome="rejected",instance="api"}'
        values: "0x5 0+1x10 10x30"
    alert_rule_test:
      - eval_time: 12m
        alertname: CallEntryFailing
        exp_alerts:
          - exp_labels: {severity: ticket, probe: rtc_signal, instance: "https://rtc"}
            exp_annotations:
              summary: "Звонки не подключаются"
              description: "Сигнализация LiveKit 3 минуты не отвечает через edge: новые люди не войдут в звонок."
              runbook: docs/runbooks/alerts.md#call-entry-failing
          - exp_labels: {severity: ticket, probe: turn_tls, instance: "turn:443"}
            exp_annotations:
              summary: "Звонки недоступны в сетях, где закрыт UDP"
              description: "Ретрансляция TURN на 443 3 минуты не принимает TLS: люди за строгими сетями не соединятся со звонком."
              runbook: docs/runbooks/alerts.md#call-entry-failing
      - eval_time: 30m
        alertname: CallEntryFailing
        exp_alerts: []
      - eval_time: 20m
        alertname: LiveKitMemoryHigh
        exp_alerts:
          - exp_labels: {severity: ticket, job: livekit, instance: "livekit:6789"}
            exp_annotations:
              summary: "Серверу звонков не хватает памяти"
              description: "LiveKit 10 минут держит больше памяти, чем ему отведено мягким пределом. Если он упрётся в жёсткий лимит, все идущие звонки оборвутся."
              runbook: docs/runbooks/alerts.md#livekit-memory-high
      - eval_time: 40m
        alertname: LiveKitMemoryHigh
        exp_alerts: []
      - eval_time: 15m
        alertname: EgressMemoryHigh
        exp_alerts:
          - exp_labels: {severity: ticket, job: egress, instance: "livekit:9090"}
            exp_annotations:
              summary: "Записи звонка не хватает памяти"
              description: "Egress 5 минут держит больше 90 % своего лимита памяти. Если он в него упрётся, идущая запись оборвётся."
              runbook: docs/runbooks/alerts.md#egress-memory-high
      - eval_time: 40m
        alertname: EgressMemoryHigh
        exp_alerts: []
      - eval_time: 14m
        alertname: LiveKitWebhooksRejected
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "Сервис отклоняет события сервера звонков"
              description: "Больше 1 % вебхуков LiveKit за 15 минут не прошли проверку подписи: звонки не открываются и не закрываются в Shosai, или кто-то шлёт поддельные события."
              runbook: docs/runbooks/alerts.md#livekit-webhooks-rejected
      - eval_time: 44m
        alertname: LiveKitWebhooksRejected
        exp_alerts: []

  # Записи звонков (meetings A15c): доля сбоев и потерянный egress.
  - interval: 1m
    input_series:
      - series: 'shosai_meetings_recordings_total{outcome="complete",instance="api"}'
        values: "0+1x45"
      - series: 'shosai_meetings_recordings_total{outcome="egress_failed",instance="api"}'
        values: "0x5 0+1x5 5x35"
      - series: 'shosai_meetings_recordings_total{outcome="egress_lost",instance="workers"}'
        values: "0x5 1x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: RecordingsFailing
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "Записи звонков не сохраняются"
              description: "Больше 5 % записей за 15 минут закончились сбоем: люди нажимают «Записать», а файла не получают."
              runbook: docs/runbooks/alerts.md#recordings-failing
      - eval_time: 40m
        alertname: RecordingsFailing
        exp_alerts: []
      - eval_time: 10m
        alertname: RecordingEgressLost
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "Запись звонка потеряна"
              description: "Обход нашёл запись, которую сервер звонков уже не ведёт и о конце которой не сообщил: её файла не будет."
              runbook: docs/runbooks/alerts.md#recording-egress-lost
      - eval_time: 44m
        alertname: RecordingEgressLost
        exp_alerts: []
