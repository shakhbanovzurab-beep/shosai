# Тикеты §16.6: причины, а не симптомы — приходят беззвучно (F5-D4), не будят. Будят только расход
# бюджета SLO и мониторы инвариантов: их правила рендерятся из кода (generated/, F5 план §3.8).
#
# Уроки черновика: «нет данных» — тоже плохо (absent для ролей); пороги циклов — от их собственного
# интервала; возраст очереди — по самому старому элементу, а не по глубине. Каждое правило проверяет
# tests/tickets.test.yml: срабатывание и снятие.

groups:
  - name: tickets-host
    rules:
      - alert: HostDiskFilling
        expr: |
          1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} > 0.8
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: 'Место на сервере заканчивается'
          description: 'Диск {{ $labels.mountpoint }} заполнен больше чем на 80 %. Когда место кончится, сервис перестанет сохранять данные.'
          runbook: docs/runbooks/alerts.md#host-disk-filling

      # На одной машине живут staging, его наблюдаемость и звонки (MR-D14): без памяти ядро убивает
      # процессы, а под сильным давлением машина перезагружалась целиком.
      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: 'Память сервера на исходе'
          description: 'Свободной памяти меньше 10 % уже 10 минут. Когда она кончится, сервер начнёт останавливать службы, а под сильным давлением может перезагрузиться.'
          runbook: docs/runbooks/alerts.md#host-memory-low

  - name: tickets-backend
    rules:
      - alert: DatabasePoolBusy
        expr: |
          max by (home) (
            sum by (home, instance) (shosai_db_pool_connections{state="in_use"})
              / sum by (home, instance) (shosai_db_pool_capacity)
          ) > 0.7
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: 'База данных {{ if eq $labels.home "ru" }}в России{{ else }}в ЕС{{ end }} перегружена подключениями'
          description: 'Сервер держит занятыми больше 70 % подключений к базе. Если они кончатся, запросы людей начнут ждать и падать.'
          runbook: docs/runbooks/alerts.md#database-pool-busy

      - alert: ProviderSlotsExhausted
        expr: sum by (provider) (increase(shosai_ai_provider_slots_total{decision=~"full|refused"}[15m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: 'Провайдер ИИ {{ $labels.provider }} не успевает отвечать'
          description: 'Все разрешённые одновременные запросы к нему заняты, новые ждут очереди или получают отказ. Люди ждут ответов ИИ дольше обычного.'
          runbook: docs/runbooks/alerts.md#provider-slots-exhausted

      - alert: TaskQueueOld
        expr: max by (queue) (shosai_task_queue_oldest_age_seconds) > 600
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: 'Фоновые задачи выполняются с задержкой больше 10 минут'
          description: 'В очереди «{{ $labels.queue }}» задача ждёт выполнения дольше 10 минут: письма, обработка и другая фоновая работа запаздывают.'
          runbook: docs/runbooks/alerts.md#task-queue-old

      - alert: MeetingRunOld
        expr: max by (home) (shosai_notes_oldest_open_run_seconds) > 600
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: 'Обработка встречи идёт дольше 10 минут'
          description: 'Самый старый незаконченный прогон встречи {{ if eq $labels.home "ru" }}в России{{ else }}в ЕС{{ end }} идёт дольше 10 минут: заметки к встрече запаздывают.'
          runbook: docs/runbooks/alerts.md#meeting-run-old

      - alert: SchedulerLoopStalled
        expr: |
          time() - shosai_loop_last_success_timestamp_seconds
            > clamp_min(3 * shosai_loop_interval_seconds, 120)
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: 'Регулярная внутренняя работа сервера остановилась'
          description: 'Повторяющаяся задача «{{ $labels.shosai_loop_name }}» давно не завершалась успешно. То, что она делает (рассылки, очистка, синхронизация), сейчас не происходит.'
          runbook: docs/runbooks/alerts.md#scheduler-loop-stalled

      - alert: HomeUnreachableFromApp
        expr: max by (home) (shosai_db_home_state{shosai_db_home_state="unreachable"}) == 1
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: 'Сервер не может связаться с базой данных {{ if eq $labels.home "ru" }}в России{{ else }}в ЕС{{ end }}'
          description: 'Люди, чьи данные хранятся в этой базе, сейчас получают ошибку при каждом действии.'
          runbook: docs/runbooks/alerts.md#home-unreachable-from-app

      - alert: TelemetryDropped
        expr: |
          sum(increase(shosai_telemetry_dropped_total[15m])) > 0
          or
          sum(increase({__name__=~"otelcol_exporter_(send|enqueue)_failed_(log_records|spans)|otelcol_receiver_refused_(log_records|spans)|otelcol_processor_tail_sampling_sampling_trace_dropped_too_early|tempo_receiver_refused_spans"}[15m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: 'Часть записей мониторинга потеряна'
          description: 'Журналы или трассировки не дошли до хранилища — на графиках и в журналах могут быть пробелы. На работу сервиса для людей это не влияет.'
          runbook: docs/runbooks/alerts.md#telemetry-dropped

      - alert: LeoToolsetLoadsFrequent
        expr: |
          sum(increase(shosai_agent_load_toolset_total[1d]))
            / sum(increase(shosai_agent_turns_total[1d])) > 0.05
          and sum(increase(shosai_agent_turns_total[1d])) >= 100
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: 'Leo часто догружает наборы инструментов'
          description: 'Больше чем в 5 % ходов за сутки модели пришлось загрузить набор инструментов, который маршрутизация не предложила. Каждая загрузка стоит лишнего раунда: ответы Leo приходят медленнее и дороже.'
          runbook: docs/runbooks/alerts.md#leo-toolset-loads-frequent

  - name: tickets-memory
    rules:
      - alert: MemoryAdmissionSlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(shosai_memory_admission_lag_seconds_bucket[5m]))) > 60
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: 'Память Leo разбирает ходы медленно'
          description: 'Полчаса подряд 5 % ходов память разбирает дольше минуты. Строка «Leo может запомнить» под ответом появляется с опозданием, новые факты попадают в ответы позже.'
          runbook: docs/runbooks/alerts.md#memory-admission-slow

      - alert: MemoryExtractionFailing
        expr: |
          sum(increase(shosai_memory_extractions_total{outcome="failed"}[30m]))
            / sum(increase(shosai_memory_extractions_total[30m])) > 0.05
          and sum(increase(shosai_memory_extractions_total[30m])) >= 20
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: 'Память Leo не может разобрать ходы и встречи'
          description: 'Больше 5 % обращений памяти к модели за полчаса заканчиваются сбоем. Задачи повторяются, но то, что человек просил запомнить, может не сохраниться.'
          runbook: docs/runbooks/alerts.md#memory-extraction-failing

      - alert: MemoryCandidatesTurnedDown
        expr: |
          sum(increase(shosai_memory_candidates_total{source!="imported",answer="accepted"}[28d]))
            / sum(increase(shosai_memory_candidates_total{source!="imported",answer=~"accepted|turned_down"}[28d])) < 0.7
          and sum(increase(shosai_memory_candidates_total{source!="imported",answer=~"accepted|turned_down"}[28d])) >= 100
        for: 1d
        labels:
          severity: ticket
        annotations:
          summary: 'Люди отклоняют больше трети того, что Leo предлагает запомнить'
          description: 'За четыре недели меньше 70 % ответов на «Запомнить?» — «Запомнить». Leo предлагает лишнее и отнимает внимание людей; отбор кандидатов стоит пересмотреть.'
          runbook: docs/runbooks/alerts.md#memory-candidates-turned-down

  - name: tickets-studio
    rules:
      - alert: StudioCatalogueRefreshStale
        expr: |
          (sum(increase(shosai_studio_catalogue_refresh_total{outcome="done"}[2d])) or vector(0)) == 0
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: 'Каталог моделей двое суток не сверялся с OpenRouter'
          description: 'Ежедневная сверка каталога studio двое суток не закончилась: список OpenRouter не читается или в нём не хватает доли каталога. Модели живут со вчерашним описанием; выключенных и предложений уровня нет.'
          runbook: docs/runbooks/alerts.md#studio-catalogue-refresh-stale

      - alert: StudioDefaultBroken
        expr: |
          sum(increase(shosai_studio_broken_defaults_total[25h])) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: 'Модель по умолчанию одной из ролей не может отвечать'
          description: 'Сверка каталога нашла умолчание или запасную модель роли, которой нет в списке OpenRouter или которая больше не читает нужное роли. Роль отвечает запасной моделью, а без неё — ошибкой. Назначьте другое умолчание на экране AI-моделей.'
          runbook: docs/runbooks/alerts.md#studio-default-broken

      - alert: StudioTierProposalWaiting
        expr: |
          sum(increase(shosai_studio_waiting_tier_proposals_total[25h])) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: 'Предложение уровня модели ждёт админа больше трёх дней'
          description: 'Цена модели предложила другой уровень, а решения нет. Пока его нет, модель считается в прежнем уровне — в лимитах людей и в расходах платформы. Подтвердите или отклоните предложение на экране AI-моделей.'
          runbook: docs/runbooks/alerts.md#studio-tier-proposal-waiting

      - alert: StudioRoleUnconfigured
        expr: |
          sum by (studio_role) (increase(shosai_studio_role_unconfigured_total[15m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: 'Роль {{ $labels.studio_role }} осталась без модели по умолчанию'
          description: 'Запросы роли получают model_role_unconfigured (503): у неё нет умолчания и запасной модели, которые могут ответить. Назначьте роли умолчание на экране AI-моделей.'
          runbook: docs/runbooks/alerts.md#studio-role-unconfigured

      - alert: StudioSubstitutionsHigh
        expr: |
          (
            sum by (studio_role, reason) (increase(shosai_studio_route_substitutions_total[1h]))
              / on (studio_role) group_left
            sum by (studio_role) (increase(shosai_studio_resolution_seconds_count[1h]))
          ) > 0.05
          and on (studio_role)
          sum by (studio_role) (increase(shosai_studio_resolution_seconds_count[1h])) >= 20
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: 'В роли {{ $labels.studio_role }} выбор людей часто не отвечает: {{ $labels.reason }}'
          description: 'Больше 5 % разрешений роли за час отвечают моделью по умолчанию вместо выбранной людьми. Причина — в метке reason: модель выключена, убрана из каталога, не умеет нужного роли или не входит в тариф.'
          runbook: docs/runbooks/alerts.md#studio-substitutions-high

  # Звонки (meetings §3.7, A15): вход в звонок снаружи, память LiveKit и egress, подпись вебхуков.
  - name: tickets-meetings
    rules:
      - alert: CallEntryFailing
        expr: probe_success{probe=~"rtc_signal|turn_tls"} == 0
        for: 3m
        labels:
          severity: ticket
        annotations:
          summary: '{{ if eq $labels.probe "turn_tls" }}Звонки недоступны в сетях, где закрыт UDP{{ else }}Звонки не подключаются{{ end }}'
          description: '{{ if eq $labels.probe "turn_tls" }}Ретрансляция TURN на 443 3 минуты не принимает TLS: люди за строгими сетями не соединятся со звонком.{{ else }}Сигнализация LiveKit 3 минуты не отвечает через edge: новые люди не войдут в звонок.{{ end }}'
          runbook: docs/runbooks/alerts.md#call-entry-failing

      # Мягкий предел Go (GOMEMLIMIT) — 90 % жёсткого лимита контейнера: если процесс выше него,
      # сборщик мусора уже не справляется, и до убийства по лимиту недалеко.
      - alert: LiveKitMemoryHigh
        expr: process_resident_memory_bytes{job="livekit"} > go_gc_gomemlimit_bytes{job="livekit"}
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: 'Серверу звонков не хватает памяти'
          description: 'LiveKit 10 минут держит больше памяти, чем ему отведено мягким пределом. Если он упрётся в жёсткий лимит, все идущие звонки оборвутся.'
          runbook: docs/runbooks/alerts.md#livekit-memory-high

      # Лимит памяти egress — 1 ГиБ и локально, и на staging (compose.dev.yaml, deploy/staging/compose.yaml).
      - alert: EgressMemoryHigh
        expr: livekit_egress_cgroup_memory_bytes{job="egress"} > 0.9 * 1073741824
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: 'Записи звонка не хватает памяти'
          description: 'Egress 5 минут держит больше 90 % своего лимита памяти. Если он в него упрётся, идущая запись оборвётся.'
          runbook: docs/runbooks/alerts.md#egress-memory-high

      - alert: LiveKitWebhooksRejected
        expr: |
          sum(increase(shosai_meetings_webhook_verifications_total{outcome="rejected"}[15m]))
            > 0.01 * sum(increase(shosai_meetings_webhook_verifications_total[15m]))
          and sum(increase(shosai_meetings_webhook_verifications_total{outcome="rejected"}[15m])) >= 3
        labels:
          severity: ticket
        annotations:
          summary: 'Сервис отклоняет события сервера звонков'
          description: 'Больше 1 % вебхуков LiveKit за 15 минут не прошли проверку подписи: звонки не открываются и не закрываются в Shosai, или кто-то шлёт поддельные события.'
          runbook: docs/runbooks/alerts.md#livekit-webhooks-rejected

      - alert: RecordingsFailing
        expr: |
          sum(increase(shosai_meetings_recordings_total{outcome!="complete"}[15m]))
            > 0.05 * sum(increase(shosai_meetings_recordings_total[15m]))
          and sum(increase(shosai_meetings_recordings_total{outcome!="complete"}[15m])) >= 1
        labels:
          severity: ticket
        annotations:
          summary: 'Записи звонков не сохраняются'
          description: 'Больше 5 % записей за 15 минут закончились сбоем: люди нажимают «Записать», а файла не получают.'
          runbook: docs/runbooks/alerts.md#recordings-failing

      # Запись, у которой пропал egress: строка говорит «идёт», а LiveKit её не знает (§3.7).
      - alert: RecordingEgressLost
        expr: sum(increase(shosai_meetings_recordings_total{outcome="egress_lost"}[30m])) >= 1
        labels:
          severity: ticket
        annotations:
          summary: 'Запись звонка потеряна'
          description: 'Обход нашёл запись, которую сервер звонков уже не ведёт и о конце которой не сообщил: её файла не будет.'
          runbook: docs/runbooks/alerts.md#recording-egress-lost

  - name: tickets-targets
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: 'Мониторинг не может опросить службу {{ if $labels.service }}{{ $labels.service }}{{ else }}{{ $labels.job }}{{ end }}'
          description: 'Служба 5 минут не отвечает на запросы мониторинга: она остановилась или зависла.'
          runbook: docs/runbooks/alerts.md#scrape-target-down

      # Роли нет совсем — нет и цели: up == 0 этого не видит.
      - alert: RoleMissing
        expr: |
          absent(up{service="api"}) or absent(up{service="ws"}) or absent(up{service="scheduler"})
          or absent(up{service="workers-critical"}) or absent(up{service="workers-default"})
          or absent(up{service="workers-bulk"}) or absent(up{service="workers-meeting"})
          or absent(up{service="workers-agent"})
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: 'Служба {{ $labels.service }} не запущена'
          description: 'Ни одного процесса этой службы нет уже 10 минут — её часть работы сервиса не выполняется.'
          runbook: docs/runbooks/alerts.md#role-missing

  - name: tickets-probes
    rules:
      - alert: EdgeHealthFailing
        expr: probe_success{probe="edge_health"} == 0
        for: 3m
        labels:
          severity: ticket
        annotations:
          summary: 'Сайт не отвечает'
          description: 'Проверка изнутри сервера 3 минуты не получает ответа от сайта. Если внешняя проверка UptimeRobot тоже прислала тревогу — люди не могут пользоваться сервисом.'
          runbook: docs/runbooks/alerts.md#edge-health-failing

      - alert: CertificateExpiresSoon
        expr: (probe_ssl_earliest_cert_expiry{probe="edge_health"} - time()) / 86400 < 21
        labels:
          severity: ticket
        annotations:
          summary: 'Сертификат HTTPS сайта скоро истечёт'
          description: 'До конца сертификата меньше 21 дня, а автоматическое продление его не обновило. После истечения браузеры покажут предупреждение, что сайт небезопасен.'
          runbook: docs/runbooks/alerts.md#certificate-expires-soon

      - alert: HomeDatabaseUnreachable
        expr: probe_success{probe="home_database"} == 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: 'База данных {{ if eq $labels.home "ru" }}в России{{ else }}в ЕС{{ end }} не отвечает'
          description: 'Сервер 5 минут не может даже установить с ней соединение.'
          runbook: docs/runbooks/alerts.md#home-database-unreachable

      - alert: RussianHomeLinkSlow
        expr: probe_duration_seconds{probe="home_database",home="ru"} > 0.25
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: 'Связь с базой данных в России медленная'
          description: 'Соединение с ней 15 минут занимает больше 0,25 секунды, поэтому у людей, чьи данные хранятся в России, всё работает медленнее.'
          runbook: docs/runbooks/alerts.md#russian-home-link-slow
