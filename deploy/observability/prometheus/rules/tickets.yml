# Тикеты §16.6: причины, а не симптомы — приходят беззвучно (F5-D4), не будят. Будят только расход
# бюджета SLO и мониторы инвариантов: их правила рендерятся из кода (generated/, F5 план §3.8).
#
# Уроки черновика: «нет данных» — тоже плохо (absent для ролей); пороги циклов — от их собственного
# интервала; возраст очереди — по самому старому элементу, а не по глубине. Каждое правило проверяет
# tests/tickets.test.yml: срабатывание и снятие.

groups:
  - name: tickets-host
    rules:
      - alert: HostDiskFilling
        expr: |
          1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} > 0.8
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: 'Место на сервере заканчивается'
          description: 'Диск {{ $labels.mountpoint }} заполнен больше чем на 80 %. Когда место кончится, сервис перестанет сохранять данные.'
          runbook: docs/runbooks/alerts.md#host-disk-filling

  - name: tickets-backend
    rules:
      - alert: DatabasePoolBusy
        expr: |
          max by (home) (
            sum by (home, instance) (shosai_db_pool_connections{state="in_use"})
              / sum by (home, instance) (shosai_db_pool_capacity)
          ) > 0.7
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: 'База данных {{ if eq $labels.home "ru" }}в России{{ else }}в ЕС{{ end }} перегружена подключениями'
          description: 'Сервер держит занятыми больше 70 % подключений к базе. Если они кончатся, запросы людей начнут ждать и падать.'
          runbook: docs/runbooks/alerts.md#database-pool-busy

      - alert: ProviderSlotsExhausted
        expr: sum by (provider) (increase(shosai_ai_provider_slots_total{decision=~"full|refused"}[15m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: 'Провайдер ИИ {{ $labels.provider }} не успевает отвечать'
          description: 'Все разрешённые одновременные запросы к нему заняты, новые ждут очереди или получают отказ. Люди ждут ответов ИИ дольше обычного.'
          runbook: docs/runbooks/alerts.md#provider-slots-exhausted

      - alert: TaskQueueOld
        expr: max by (queue) (shosai_task_queue_oldest_age_seconds) > 600
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: 'Фоновые задачи выполняются с задержкой больше 10 минут'
          description: 'В очереди «{{ $labels.queue }}» задача ждёт выполнения дольше 10 минут: письма, обработка и другая фоновая работа запаздывают.'
          runbook: docs/runbooks/alerts.md#task-queue-old

      - alert: MeetingRunOld
        expr: max by (home) (shosai_notes_oldest_open_run_seconds) > 600
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: 'Обработка встречи идёт дольше 10 минут'
          description: 'Самый старый незаконченный прогон встречи {{ if eq $labels.home "ru" }}в России{{ else }}в ЕС{{ end }} идёт дольше 10 минут: заметки к встрече запаздывают.'
          runbook: docs/runbooks/alerts.md#meeting-run-old

      - alert: SchedulerLoopStalled
        expr: |
          time() - shosai_loop_last_success_timestamp_seconds
            > clamp_min(3 * shosai_loop_interval_seconds, 120)
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: 'Регулярная внутренняя работа сервера остановилась'
          description: 'Повторяющаяся задача «{{ $labels.shosai_loop_name }}» давно не завершалась успешно. То, что она делает (рассылки, очистка, синхронизация), сейчас не происходит.'
          runbook: docs/runbooks/alerts.md#scheduler-loop-stalled

      - alert: HomeUnreachableFromApp
        expr: max by (home) (shosai_db_home_state{shosai_db_home_state="unreachable"}) == 1
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: 'Сервер не может связаться с базой данных {{ if eq $labels.home "ru" }}в России{{ else }}в ЕС{{ end }}'
          description: 'Люди, чьи данные хранятся в этой базе, сейчас получают ошибку при каждом действии.'
          runbook: docs/runbooks/alerts.md#home-unreachable-from-app

      - alert: TelemetryDropped
        expr: |
          sum(increase(shosai_telemetry_dropped_total[15m])) > 0
          or
          sum(increase({__name__=~"otelcol_exporter_(send|enqueue)_failed_(log_records|spans)|otelcol_receiver_refused_(log_records|spans)|otelcol_processor_tail_sampling_sampling_trace_dropped_too_early|tempo_receiver_refused_spans"}[15m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: 'Часть записей мониторинга потеряна'
          description: 'Журналы или трассировки не дошли до хранилища — на графиках и в журналах могут быть пробелы. На работу сервиса для людей это не влияет.'
          runbook: docs/runbooks/alerts.md#telemetry-dropped

      - alert: LeoToolsetLoadsFrequent
        expr: |
          sum(increase(shosai_agent_load_toolset_total[1d]))
            / sum(increase(shosai_agent_turns_total[1d])) > 0.05
          and sum(increase(shosai_agent_turns_total[1d])) >= 100
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: 'Leo часто догружает наборы инструментов'
          description: 'Больше чем в 5 % ходов за сутки модели пришлось загрузить набор инструментов, который маршрутизация не предложила. Каждая загрузка стоит лишнего раунда: ответы Leo приходят медленнее и дороже.'
          runbook: docs/runbooks/alerts.md#leo-toolset-loads-frequent

  - name: tickets-targets
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: 'Мониторинг не может опросить службу {{ if $labels.service }}{{ $labels.service }}{{ else }}{{ $labels.job }}{{ end }}'
          description: 'Служба 5 минут не отвечает на запросы мониторинга: она остановилась или зависла.'
          runbook: docs/runbooks/alerts.md#scrape-target-down

      # Роли нет совсем — нет и цели: up == 0 этого не видит.
      - alert: RoleMissing
        expr: |
          absent(up{service="api"}) or absent(up{service="ws"}) or absent(up{service="scheduler"})
          or absent(up{service="workers-critical"}) or absent(up{service="workers-default"})
          or absent(up{service="workers-bulk"}) or absent(up{service="workers-meeting"})
          or absent(up{service="workers-agent"})
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: 'Служба {{ $labels.service }} не запущена'
          description: 'Ни одного процесса этой службы нет уже 10 минут — её часть работы сервиса не выполняется.'
          runbook: docs/runbooks/alerts.md#role-missing

  - name: tickets-probes
    rules:
      - alert: EdgeHealthFailing
        expr: probe_success{probe="edge_health"} == 0
        for: 3m
        labels:
          severity: ticket
        annotations:
          summary: 'Сайт не отвечает'
          description: 'Проверка изнутри сервера 3 минуты не получает ответа от сайта. Если внешняя проверка UptimeRobot тоже прислала тревогу — люди не могут пользоваться сервисом.'
          runbook: docs/runbooks/alerts.md#edge-health-failing

      - alert: CertificateExpiresSoon
        expr: (probe_ssl_earliest_cert_expiry{probe="edge_health"} - time()) / 86400 < 21
        labels:
          severity: ticket
        annotations:
          summary: 'Сертификат HTTPS сайта скоро истечёт'
          description: 'До конца сертификата меньше 21 дня, а автоматическое продление его не обновило. После истечения браузеры покажут предупреждение, что сайт небезопасен.'
          runbook: docs/runbooks/alerts.md#certificate-expires-soon

      - alert: HomeDatabaseUnreachable
        expr: probe_success{probe="home_database"} == 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: 'База данных {{ if eq $labels.home "ru" }}в России{{ else }}в ЕС{{ end }} не отвечает'
          description: 'Сервер 5 минут не может даже установить с ней соединение.'
          runbook: docs/runbooks/alerts.md#home-database-unreachable

      - alert: RussianHomeLinkSlow
        expr: probe_duration_seconds{probe="home_database",home="ru"} > 0.25
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: 'Связь с базой данных в России медленная'
          description: 'Соединение с ней 15 минут занимает больше 0,25 секунды, поэтому у людей, чьи данные хранятся в России, всё работает медленнее.'
          runbook: docs/runbooks/alerts.md#russian-home-link-slow
