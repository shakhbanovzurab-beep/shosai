# Роли бэкенда из локального образа рядом с compose.dev.yaml (docs/development.md, «Observability»).
#
# Нужен там, где важен путь, которым идёт телеметрия на staging: строки уходят в stdout контейнера,
# json-file Docker кладёт их на диск, коллектор читает их оттуда; трейсы идут в коллектор по OTLP.
# Для обычной разработки роли по-прежнему запускаются через uv.
#
# Настройки — локальные значения из .env.example; адреса служб заменены именами в сети
# shosai-local_default. По умолчанию поднимаются api и edge; остальные роли — профиль all-roles.
# Edge нужен свой самоподписанный сертификат: один раз deploy/local/edge-certificate.sh.
#
#   deploy/local/edge-certificate.sh
#   docker compose -f deploy/local/compose.app.yaml up -d --build
#   docker compose -f deploy/local/compose.app.yaml --profile all-roles up -d

name: shosai-local-app

x-backend: &backend
  image: ${SHOSAI_BACKEND_IMAGE:-shosai-backend:local}
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp
  env_file:
    - path: ../../.env.example
  environment:
    HOME_RU_DATABASE_URL: postgresql://shosai_app:${LOCAL_APP_PASSWORD:-local-app}@pgbouncer-ru:6432/shosai
    HOME_RU_MIGRATION_DATABASE_URL: postgresql://shosai_migrator:${LOCAL_MIGRATOR_PASSWORD:-local-migrator}@postgres-ru:5432/shosai
    HOME_EU_DATABASE_URL: postgresql://shosai_app:${LOCAL_APP_PASSWORD:-local-app}@pgbouncer-eu:6432/shosai
    HOME_EU_MIGRATION_DATABASE_URL: postgresql://shosai_migrator:${LOCAL_MIGRATOR_PASSWORD:-local-migrator}@postgres-eu:5432/shosai
    HOME_RU_S3_ENDPOINT_URL: http://s3:8333
    HOME_EU_S3_ENDPOINT_URL: http://s3:8333
    VALKEY_URL: redis://:${LOCAL_VALKEY_PASSWORD:-local-valkey}@valkey:6379/0
    REDIS_CACHE_URL: redis://:${LOCAL_REDIS_CACHE_PASSWORD:-local-redis-cache}@redis-cache:6379/0
    QDRANT_URL: http://qdrant:6333
    QDRANT_API_KEY: ${LOCAL_QDRANT_API_KEY:-local-qdrant}
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    BIND_HOST: 0.0.0.0
    OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
    # Письма с кодами (регистрация, вход) пишутся только с ключом; по умолчанию его нет, как в
    # .env.example. Для проверки с аккаунтами: LOCAL_FERNET_KEY=<ключ> перед up.
    FERNET_KEY: ${LOCAL_FERNET_KEY:-}
    # Оповещения о бизнес-событиях — в локальный Alertmanager: без секретов бота он никому не пишет.
    ALERTING_ENABLED: "true"
  # Ротация (§14 правило 11) и метки Compose в каждой строке: по ним коллектор узнаёт службу.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      labels: "com.docker.compose.project,com.docker.compose.service"
  stop_grace_period: 30s
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/readyz', timeout=2)"
    interval: 30s
    timeout: 5s
    retries: 3
    start_interval: 2s
    start_period: 30s
  networks:
    - local
  deploy:
    resources:
      limits:
        memory: 384m

services:
  api:
    <<: *backend
    build:
      context: ../../backend
    command: ["api"]
    ports:
      - "127.0.0.1:18000:8000"

  ws:
    <<: *backend
    profiles: ["all-roles"]
    command: ["ws"]

  workers-critical:
    <<: *backend
    profiles: ["all-roles"]
    command: ["workers", "--queue", "critical"]

  workers-default:
    <<: *backend
    profiles: ["all-roles"]
    command: ["workers", "--queue", "default"]

  workers-bulk:
    <<: *backend
    profiles: ["all-roles"]
    command: ["workers", "--queue", "bulk"]

  workers-meeting:
    <<: *backend
    profiles: ["all-roles"]
    command: ["workers", "--queue", "meeting"]

  # Ходы Leo (AG-D12): до 48 ходов в процессе; при остановке дослушивает их до 190 с.
  workers-agent:
    <<: *backend
    profiles: ["all-roles"]
    command: ["workers", "--queue", "agent"]
    stop_grace_period: 200s
    deploy:
      resources:
        limits:
          memory: 512m

  scheduler:
    <<: *backend
    profiles: ["all-roles"]
    command: ["scheduler"]

  # Edge staging с кабинетом, собранный из frontend/Dockerfile; HTTPS на 127.0.0.1:18443.
  edge:
    image: ${SHOSAI_EDGE_IMAGE:-shosai-edge:local}
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      SHOSAI_SERVER_NAME: localhost
      SHOSAI_TLS_CERTIFICATE: /run/shosai-edge-tls/edge.crt
      SHOSAI_TLS_CERTIFICATE_KEY: /run/shosai-edge-tls/edge.key
      SHOSAI_ROBOTS_TAG: "noindex, nofollow"
      # Локальный LiveKit без TLS, а страница edge — по HTTPS: звонки проверяются через Vite (dev:api).
      SHOSAI_CSP_RTC_ORIGINS: ""
      # Коллектор локального стека наблюдаемости (deploy/observability).
      SHOSAI_OTEL_TRACE: "on"
    volumes:
      - ./tls:/run/shosai-edge-tls:ro
    ports:
      - "127.0.0.1:18443:8443"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "com.docker.compose.project,com.docker.compose.service"
    networks:
      - local
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m

networks:
  local:
    name: shosai-local_default
    external: true
