;; PgBouncer перед локальным сервером одного дома — замена пулера управляемой БД
;; (target architecture §4.1, §14 правило 2, §19 «PgBouncer and one pool per
;; database per process»). Общая часть для обоих домов; адрес сервера дома лежит
;; в /etc/pgbouncer/databases.ini, который compose.dev.yaml монтирует отдельно
;; для RU и для EU.

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
;; Unix-сокет не нужен: клиенты приходят по TCP, а корневая ФС только для чтения.
unix_socket_dir =

auth_type = scram-sha-256
;; Файл пишет start.sh при старте контейнера из переменных окружения (tmpfs).
auth_file = /run/pgbouncer/userlist.txt

;; Режим транзакций, как в целевой архитектуре: сессионные возможности
;; (подготовленные выражения, сессионные блокировки, LISTEN) недоступны.
pool_mode = transaction
;; Подготовленные выражения на уровне протокола выключены намеренно: §19 считает
;; их запрещёнными в режиме транзакций, и код, проверенный здесь, не зависит от
;; настроек пулера у будущего провайдера (ADR 0001).
max_prepared_statements = 0

;; Серверных соединений на пару (база, пользователь) — с запасом над пулом
;; приложения (10 на процесс, §4.3) для нескольких локальных процессов.
default_pool_size = 20
;; Сумма серверных соединений роли приложения по всем базам держится ниже
;; max_connections сервера (100), чтобы прямые подключения миграций и
;; администратора всегда проходили (§14 правило 2).
max_user_connections = 80
max_client_conn = 1000

;; Транзакция, брошенная клиентом, не держит серверное соединение бесконечно.
idle_transaction_timeout = 60

%include /etc/pgbouncer/databases.ini
