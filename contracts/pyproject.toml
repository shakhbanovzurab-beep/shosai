[project]
name = "shosai-contracts"
version = "1.0.0"
description = "Draft API and WebSocket contract baseline and the compatibility harness for v2 slices"
requires-python = ">=3.14"
# Коммерческая лицензия проекта; канонический текст — LICENSE в корне репозитория,
# копию здесь требует упаковка (PEP 639 не допускает путей вне проекта).
license = "LicenseRef-Shosai-Commercial"
license-files = ["LICENSE"]
# Рантайм намеренно без зависимостей: харнесс подключается к backend v2
# path-зависимостью и не должен тянуть в него свои версии библиотек.
dependencies = []

[project.scripts]
shosai-contracts = "shosai_contracts.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "python-doctor>=2026.5.11",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "C90", "N", "S", "ANN", "PT", "RET", "PTH"]
# RUF001 и RUF003 выключены: сообщения для инженеров и комментарии пишутся по-русски.
# Докстринги пишутся по-английски (CLAUDE.md, «Language»), их проверяет
# tests/test_docstrings_english.py, поэтому RUF002 включён.
ignore = ["PLR2004", "RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
